name: Azure Static Web App v1.19

on:
  workflow_dispatch:
  push:
    branches:
      - v1.19
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - v1.19

jobs:
  check_state:
    name: Check branch state
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.read_state.outputs.is_latest }}
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
      - name: Read version_menu from hugo.yaml
        id: read_state
        run: |
          # Gate signal: this workflow only deploys when hugo.yaml's
          # params.version_menu does NOT contain "(latest)" — i.e., the
          # branch is currently preview or archived. While the branch is
          # the live "latest", website-root.yml owns the deploy.
          VERSION_MENU=$(yq '.params.version_menu' hugo.yaml)
          echo "version_menu read from hugo.yaml: '$VERSION_MENU'"
          if [[ -z "$VERSION_MENU" || "$VERSION_MENU" == "null" ]]; then
            echo "::error::params.version_menu is missing from hugo.yaml — cannot determine branch state."
            exit 1
          fi
          if [[ "$VERSION_MENU" == *"(latest)"* ]]; then
            echo "Branch is the live 'latest' — deploy job will be skipped."
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch is preview or archived — deploy job will run."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build_and_deploy_job:
    needs: check_state
    if: needs.check_state.outputs.is_latest != 'true' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.0.0
        with:
          hugo-version: 0.147.9
          extended: true
      - name: Setup Submodules
        run: |
          cd daprdocs
          git submodule update --init --recursive
          cd ..
          sudo npm install -D --save autoprefixer
          sudo npm install -D --save postcss-cli
      - name: Trim for Free tier
        run: |
          rm -rf daprdocs/content/zh-hans translations/docs-zh
          rm -rf daprdocs/themes/docsy/assets/vendor/Font-Awesome/svgs
          rm -rf daprdocs/themes/docsy/assets/vendor/Font-Awesome/sprites
          rm -rf daprdocs/themes/docsy/assets/vendor/Font-Awesome/js-packages
          rm -rf daprdocs/themes/docsy/assets/vendor/Font-Awesome/metadata
          rm -rf daprdocs/themes/docsy/assets/vendor/bootstrap/site
          rm -rf daprdocs/themes/docsy/assets/vendor/bootstrap/js/tests
          rm -rf daprdocs/themes/docsy/assets/vendor/bootstrap/scss/tests
      - name: Build Hugo Website
        run: |
          git config --global --add safe.directory /github/workspace
          hugo --minify --disableKinds RSS,sitemap,taxonomy,term
      - name: Deploy Website
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          HUGO_ENV: production
          HUGO_VERSION: "0.147.9"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_V1_19 }}
          skip_deploy_on_missing_secrets: true
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/daprdocs/public" # App source code path
          output_location: "/" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    needs: check_state
    if: needs.check_state.outputs.is_latest != 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_V1_19 }}
          skip_deploy_on_missing_secrets: true
          app_location: "/daprdocs/public" # App source code path
          action: "close"
