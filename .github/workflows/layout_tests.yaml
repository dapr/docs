name: layout-tests

# Guards the rendered layout, which the Hugo build job does not: a site can
# compile cleanly and still put the page content a full screen below the fold.
# See tests/layout.spec.js for what each assertion protects against.

on:
  push:
    branches:
      - v*
  pull_request:
    branches:
      - v*

permissions:
  contents: read

concurrency:
  group: layout-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-tests:
    name: Layout tests
    runs-on: ubuntu-latest
    env:
      NODE_VER: 22.x
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, matching the deploy workflow. hugo.yaml sets
          # enableGitInfo, so with the default shallow clone every page's
          # "Last modified" resolves to the single commit available - on a PR
          # that is the synthetic merge commit, whose subject is two 40-char
          # SHAs. The pages then differ from what actually ships.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium is needed; the invariants are layout-engine level and the
      # other browsers would triple install time for no extra signal.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts Hugo itself via `webServer`, so there is no
      # separate build or serve step here.
      - name: Run layout tests
        run: npm run test:layout

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
