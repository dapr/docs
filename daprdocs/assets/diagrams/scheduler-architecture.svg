<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.02 1.5 960 302" role="img" aria-labelledby="scheduler-architecture-title scheduler-architecture-desc"><title id="scheduler-architecture-title">How the Scheduler service is used through the Jobs API</title><desc id="scheduler-architecture-desc">An application hexagon on the left, the Dapr sidecar in the middle and a dashed process on the right holding the Scheduler service and etcd. The application calls its sidecar over the Jobs API, using gRPC or HTTP, and the sidecar sends the triggered job back to the application as an OnJobEvent. The sidecar schedules, gets and deletes jobs on the Scheduler, and holds a WatchJobs stream open on which the Scheduler returns jobs as they come due. The Scheduler stores every job it tracks in etcd, which by default is embedded in the Scheduler service itself.</desc><g class="d-hex d-hex-solid"><polygon points="96,72 147.96,102 147.96,162 96,192 44.04,162 44.04,102" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.81" stroke-linejoin="round" stroke-linecap="round"/><text x="96" y="137.95" text-anchor="middle" font-size="17" font-weight="600" fill="var(--d-app-ink)">My app</text></g><g class="d-mark-hex"><polygon points="392,72 443.96,102 443.96,162 392,192 340.04,162 340.04,102" fill="var(--d-diagram-plate)" stroke="var(--d-sky)" stroke-width="1.81" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(352 92) scale(0.1667)"><defs/><g id="ic-scheduler-architecture-logo-blue-392-132-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.618361,300.964459 96.7699392,300.964459 C87.3140802,300.964459 78.8968522,297.712348 71.5180026,291.208029 C62.7180414,283.446572 58.3181267,273.170995 58.3181267,260.380989 C58.3181267,247.3723