<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" role="img" aria-labelledby="pubsub-namespace-basic-title pubsub-namespace-basic-desc"><title id="pubsub-namespace-basic-title">Two apps in one namespace, publishing and subscribing to one topic</title><desc id="pubsub-namespace-basic-desc">At the top, a green message broker named order, with Message broker written under it, and beside it a card titled Consumer group names listing App1 and App2. Below, a dashed region captioned Kubernetes cluster holds a second dashed region captioned namespace-a, which holds two hexagons with Dapr sidecars: App1, whose line goes up to the broker and is labelled publish, and App2, whose line comes down from the broker and is labelled subscribe.</desc><g class="d-elbow-arrow"><path class="d-run" d="M195,365.5 L205,365.5 Q215,365.5 215,355.5 L215,54 Q215,42 227,42 L265,42" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="240" y1="42" x2="265" y2="42" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="257.98,45.84 265,42 257.98,38.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="225" y="208.3" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">publish</text><text x="225" y="208.3" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)">publish</text></g><g class="d-elbow-arrow"><path class="d-run" d="M421,42 L432.84,42 Q444.68,42 444.68,53.84 L444.68,355.5 Q444.68,365.5 434.68,365.5 L424.68,365.5" fill="none" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="434.68" y1="365.5" x2="424.68" y2="365.5" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyl