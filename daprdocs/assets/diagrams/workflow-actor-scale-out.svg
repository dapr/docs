<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.5 1418 676" role="img" aria-labelledby="workflow-actor-scale-out-title workflow-actor-scale-out-desc"><title id="workflow-actor-scale-out-title">Workflow and activity actors scaled out across the nodes of a cluster</title><desc id="workflow-actor-scale-out-desc">A cluster holding three nodes, each with a Dapr runtime holding a mix of workflow actors, drawn as gold circles, and workflow activity actors, drawn as blue circles. Runs between them are activity calls and child workflow calls; some stay inside their node and others cross to the next one, because a workflow that schedules tasks in parallel may have them run on as many nodes as there are tasks or on a single node. A legend below names the two kinds of actor and the two kinds of run.</desc><g class="d-region"><rect class="d-panel" x="29" y="26" width="1360" height="376" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="2.68" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="13" width="74" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.68" stroke-linejoin="round" stroke-linecap="round"/><text x="86" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Cluster</text></g></g><g><g class="d-region"><rect class="d-panel" x="65" y="62" width="404" height="304" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="2.68" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="85" y="49" width="58" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.68" stroke-linejoin="round" stroke-linecap="round"/><text x="114" y="66.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Node</text></g></g><g class="d-region"><rect class="d-panel" x="107" y="104" width="320" height="220" rx="10" fill="none" stroke="var(--d-caption)" stroke-wid