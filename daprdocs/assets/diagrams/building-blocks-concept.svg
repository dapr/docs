<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 330" role="img" aria-labelledby="building-blocks-concept-title building-blocks-concept-desc"><title id="building-blocks-concept-title">A building block, its API and its components</title><desc id="building-blocks-concept-desc">Your code, drawn as a hexagon on the left, calls a building block over HTTP or gRPC. The arrow ends on a filled circle on the edge of the building block, which is the public API the block exposes. The building block is a card with two component boxes inside it, because a building block uses one or more Dapr components to implement its capability. Two more cards are stacked behind it: this is one building block of a set.</desc><rect x="416" y="76" width="270" height="194" rx="12" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.2"/><rect x="408" y="68" width="270" height="194" rx="12" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.2"/><rect x="400" y="60" width="270" height="194" rx="12" fill="var(--d-ground)" stroke="var(--d-blue)" stroke-width="2.2"/><text x="535" y="97.6" text-anchor="middle" font-size="16" font-weight="600" fill="var(--d-body)">Building block</text><g class="d-box"><rect x="435" y="124" width="200" height="44" rx="6" fill="var(--d-ground)" fill-opacity="0.6" stroke="var(--d-orange)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="535" y="151.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)">Component</text></g><g class="d-box"><rect x="435" y="182" width="200" height="44" rx="6" fill="var(--d-ground)" fill-opacity="0.6" stroke="var(--d-orange)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="535" y="209.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)">Component</text></g><g class="d-hex"><polygon points="110,99 160.23,128 160.23,186 110,215 59.77,186 59.77,128" fill="var(--d-sky-fill)" fill-opacity="0.6" stroke="var(--d-sky)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="110" y="162.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)">Your code</text></g><line x1="320" y1="157" x2="400" y2="157" stroke="var(--d-blue)" stroke-width="2"/><line x1="162.22947341949742" y1="157" x2="299" y2="157" stroke="var(--d-blue)" stroke-width="2"/><path d="M320,136 A21,21 0 0 0 320,178" fill="none" stroke="var(--d-blue)" stroke-width="2.2" stroke-linecap="round"/><circle cx="320" cy="157" r="10" fill="var(--d-ground)" stroke="var(--d-blue)" stroke-width="2.2"/><text x="229.61" y="132.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)">API</text><text x="229.61" y="192.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)">HTTP or gRPC</text></svg>
