<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 460" role="img" aria-labelledby="actors-communication-title actors-communication-desc"><title id="actors-communication-title">One actor serving many clients is a bottleneck; one actor per client, or one client over many actors, is not</title><desc id="actors-communication-desc">Three dashed panels side by side. The first, captioned Many clients, one actor, shows four client chips all pointing at a single gold disc named Actor, and is marked with a red cross. The second, captioned Many clients, many actors, pairs each client with its own actor and is marked with a navy tick. The third, captioned One client, many actors, has a single client pointing at four actors and is also marked with a navy tick. Three dots in each panel say the rows go on.</desc><g class="d-region"><rect class="d-panel" x="29" y="27" width="246" height="419" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.62" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="14" width="174" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.62" stroke-linejoin="round" stroke-linecap="round"/><text x="136" y="31.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Many clients, one actor</text></g></g><g class="d-region"><rect class="d-panel" x="305" y="27" width="246" height="419" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.62" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="325" y="14" width="190" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.62" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="31.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Many clients, many actors</text></g></g><g class="d-region"><rect class="d-panel" x="581" y="27" width="246" height="419" rx="10" fill="