<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 946 504" role="img" aria-labelledby="distributed-lock-overview-title distributed-lock-overview-desc"><title id="distributed-lock-overview-title">Two instances of one app competing for a named lock on a shared resource</title><desc id="distributed-lock-overview-desc">Two green hexagons, one above the other, both named App 1 - they are two instances of one application - each with a hexagon carrying the Dapr logo overlapping its lower right corner, and each captioned underneath, Instance 1 and Instance 2. Between the two Dapr hexagons is a file glyph named Lock component YAML, joined to each of them by a line with a head at each end. From the upper Dapr hexagon a line runs right and turns down into the top of a gold data-store cylinder named Shared resource; a padlock and the words "Acquire named lock on resource for mutually exclusive access" stand just above that line. From the lower Dapr hexagon a dashed red line runs right and turns up into the foot of the same store; a cross in a circle and the words "Named lock denies access to update resource" stand just below it.</desc><g class="d-elbow-arrow"><path class="d-run" d="M119.93,190 L119.93,261 Q119.93,273 131.93,273 L192.9,273" fill="none" stroke="var(--d-blue)" stroke-width="1.79" stroke-linecap="round"/><g class="d-arrow"><line x1="166.9" y1="273" x2="192.9" y2="273" stroke="var(--d-blue)" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="185.88,276.84 192.9,273 185.88,269.16" stroke="var(--d-blue)" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-elbow-arrow"><path class="d-run" d="M160.9,403 L206.9,403 Q218.9,403 218.9,391 L218.9,299" fill="none" stroke="var(--d-blue)" stroke-width="1.79" stroke-linecap="round"/><g class="d-arrow"><line x1="218.9" y1="325" x2="218.9" y2="299" stroke="var(--d-blue)" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="roun