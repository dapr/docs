<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.07 0 880 545" role="img" aria-labelledby="api-scoping-title api-scoping-desc"><title id="api-scoping-title">An API allow list, and the sidecar APIs it permits</title><desc id="api-scoping-desc">On the left, a configuration headed "Sidecar configuration" holds a Dapr Configuration resource whose spec allows two APIs over gRPC: invoke and publish. An arrow runs from it to the Dapr sidecar beside MyApp in the middle. From the sidecar a line reaches a column of four Dapr APIs on the right. Service invocation and Publish and subscribe are reached by a solid arrow with a tick, because the allow list names them. State management and Bindings are reached by a dashed orange arrow with a cross, because it does not.</desc><g class="d-region"><rect class="d-panel" x="48" y="127.5" width="258" height="290" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.66" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="68" y="114.5" width="164" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.66" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="132.05" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Sidecar configuration</text></g></g><text x="76" y="193.1" text-anchor="start" font-size="12" font-weight="400" font-family="var(--font-mono)" fill="var(--d-body)"><tspan x="76">apiVersion: dapr.io/v1alpha1</tspan><tspan x="76" dy="14.4">kind: Configuration</tspan><tspan x="76" dy="14.4">metadata:</tspan><tspan x="76" dy="14.4">  name: myappconfig</tspan><tspan x="76" dy="14.4">  namespace: default</tspan><tspan x="76" dy="14.4">spec:</tspan><tspan x="76" dy="14.4">  api:</tspan><tspan x="76" dy="14.4">    allowed:</tspan><tspan x="76" dy="14.4">      - name: invoke</tspan><tspan x="76" dy="14.4">        version: v1</tspan><tspan x="76" dy="14.4">        protocol: grpc</tspan><tspan x="76" dy="14.4">      - name: publish</tspan><tspan x="76" dy="14.4">        version: v1</tspan><tspan x="76" dy="14.4">        protocol: grpc</tspan></text><g class="d-arrow"><line x1="308" y1="310.3" x2="466" y2="310.3" stroke="var(--d-blue)" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="458.98,314.14 466,310.3 458.98,306.46" stroke="var(--d-blue)" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><g class="d-hex d-hex-solid"><polygon points="468,194.2 514.77,221.2 514.77,275.2 468,302.2 421.23,275.2 421.23,221.2" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.66" stroke-linejoin="round" stroke-linecap="round"/><text x="468" y="253.8" text-anchor="middle" font-size="16" font-weight="600" fill="var(--d-app-ink)">MyApp</text></g><g class="d-mark-hex"><polygon points="503.07,269.8 538.14,290.05 538.14,330.55 503.07,350.8 468,330.55 468,290.05" fill="var(--d-diagram-plate)" stroke="var(--d-sky)" stroke-width="1.66" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(476.07 283.3) scale(0.1125)"><defs/><g id="ic-api-scoping-logo-blue-503_07-310_3-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.618361,300.964459 96.7699392,300.964459 C87.3140802,300.964459 78.8968522,297.712348 71.5180026,291.208029 C62.7180414,283.446572 58.3181267,273.170995 58.3181267,260.380989 C58.3181267,247.372351 62.827356,236.987459 71.8459499,229.226003 C79.0061668,223.049632 87.2320942,219.961493 96.5239788,219.961493 C101.935135,219.961493 107.018266,221.109297 111.773525,223.404939 C114.506432,224.716735 117.321284,226.875699 120.218166,229.881897 L120.218166,175.36067 L147.109839,175.36067 L147.109839,298.504854 Z M121.038034,260.462976 C121.038034,255.6530