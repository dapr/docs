<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="app-health-title app-health-desc"><title id="app-health-title">Dapr probing the health of the app it serves</title><desc id="app-health-desc">An application hexagon named my-app on the left, its Dapr sidecar on the right. The app provides a health endpoint, drawn as a ball on a stalk beside it and named /healthz. An arrow runs from the sidecar to that endpoint, labelled "Health probe, every 5 seconds", with a note that a 200 to 299 response is healthy. Below, a dashed card headed "Turn it on" holds a dapr run command with the app health check flags. Beside it a second card, "After 3 failures in a row", lists what Dapr stops doing on the application behalf: pub/sub subscriptions, input bindings, service invocation and actor types.</desc><g class="d-hex d-hex-solid"><polygon points="170,90 221.96,120 221.96,180 170,210 118.04,180 118.04,120" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.78" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="157" text-anchor="middle" font-size="20" font-weight="600" fill="var(--d-app-ink)">my-app</text></g><g class="d-mark-hex"><polygon points="560,102 601.57,126 601.57,174 560,198 518.43,174 518.43,126" fill="var(--d-diagram-plate)" stroke="var(--d-sky)" stroke-width="1.78" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(528 118) scale(0.1333)"><defs/><g id="ic-app-health-logo-blue-560-150-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.618361,300.964459 96.7699392,300.964459 C87.3140802,300.964459 78.8968522,297.712348 71.5180026,291.208029 C62.7180414,283.446572 58.3181267,273.170995 58.3181267,260.380989 C58.3181267,247.372351 62.827356,236.987459 71.845949