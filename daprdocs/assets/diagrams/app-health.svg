ke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="80" y="237" width="118" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.78" stroke-linejoin="round" stroke-linecap="round"/><text x="139" y="254.9" text-anchor="middle" font-size="14" font-weight="600" fill="var(--d-body)">Turn it on</text></g></g><text x="92" y="299.4" text-anchor="start" font-size="12" font-weight="400" font-family="var(--font-mono)" fill="var(--d-body)"><tspan x="92">dapr run \</tspan><tspan x="92" dy="14.4">  --app-id my-app \</tspan><tspan x="92" dy="14.4">  --app-protocol http \</tspan><tspan x="92" dy="14.4">  --enable-app-health-check \</tspan><tspan x="92" dy="14.4">  --app-health-check-path=/healthz</tspan></text><g class="d-region"><rect class="d-panel" x="560" y="250" width="260" height="130" rx="10" fill="none" stroke="var(--d-sky)" stroke-width="1.78" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="580" y="237" width="216" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-sky)" stroke-width="1.78" stroke-linejoin="round" stroke-linecap="round"/><text x="688" y="254.9" text-anchor="middle" font-size="14" font-weight="600" fill="var(--d-body)">After 3 failures in a row</text></g></g><g><text x="586" y="309.15" text-anchor="start" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="586">pub/sub subscriptions stop</tspan><tspan x="586" dy="15.6">input bindings stop</tspan><tspan x="586" dy="15.6">service invocation short-circuits</tspan><tspan x="586" dy="15.6">actor types unregister</tspan></text></g></svg>
