<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="bindings-overview-title bindings-overview-desc"><title id="bindings-overview-title">An input binding triggering an app through its sidecar, and the app calling an output binding the same way</title><desc id="bindings-overview-desc">In the middle of the drawing, the application: a green hexagon named App with the endpoint /method under its name, and below it the Dapr sidecar, a hexagon carrying the Dapr logo. Left and right of the sidecar, on its line, sits a plug-marked hexagon each: "Input binding component" on the left and "Output binding component" on the right. Coming in, an arrow runs from the input binding component to the sidecar, and a second from the sidecar up to the app, labelled "Trigger endpoint methods on app". Going out, an arrow runs from the app down to the sidecar, and a second from the sidecar to the output binding component, labelled "Execute operations on component".</desc><g><g class="d-hex"><polygon points="92,152 157.82,190 157.82,266 92,304 26.18,266 26.18,190" fill="var(--d-ground)" fill-opacity="0.6" stroke="var(--d-sky)" stroke-width="1.51" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="244.25" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-body)"><tspan x="92">Input binding</tspan><tspan x="92" dy="18">component</tspan></text></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-plug-connected" transform="translate(74.0163 187.0163) scale(1.4986)" fill="var(--d-sky)" color="var(--d-sky)"><path fill="currentColor" d="M19.49 5.57a6 6 0 0 1-1.893 8.962c-.649.351-1.43.135-1.952-.386l-5.79-5.791c-.522-.522-.738-1.303-.388-1.952A6 6 0 0 1 18.43 4.51l2.29-2.29a.75.75 0 1 1 1.061 1.06zm-2.017 7.263a4.5 4.5 0 1 0-6.306-6.306c-.266.349-.186.833.125 1.143l5.038 5.038c.31.31.794.391 1.143.125M3.28 21.78l2.29-2.29a6 6 0 0 0 8.962-1.893c.351-.649.135-1.43-.387-1.952l-5.79-5.79c-.522-.522-1.303-.738-1.952-.388A6 6 0 