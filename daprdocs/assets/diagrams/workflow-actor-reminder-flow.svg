<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.11 -5.7 913 272" role="img" aria-labelledby="workflow-actor-reminder-flow-title workflow-actor-reminder-flow-desc"><title id="workflow-actor-reminder-flow-title">How a Dapr workflow actor uses a reminder to guarantee one turn runs</title><desc id="workflow-actor-reminder-flow-desc">In the middle, a circle named Workflow Actor. To its left, the Dapr hexagon named Actor runtime; to its right, an app hexagon named Workflow code. Six numbered steps: Schedule execution arrives at the actor from above; the actor creates a one-shot reminder in the actor runtime; the reminder fires back into the actor; the actor runs the workflow step in the workflow code; the code sends the workflow step result back; and the actor deletes the reminder. The reminder is armed before any application code runs, so a host that crashes mid-step is recovered when the reminder reactivates the actor.</desc><g class="d-arrow"><line x1="448.39" y1="14" x2="448.39" y2="88" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="444.55,80.98 448.39,88 452.22,80.98" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="460.39" y="56.55" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">1. Schedule execution</text><text x="460.39" y="56.55" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-caption)">1. Schedule execution</text></g><g class="d-arrow"><line x1="404.71" y1="108" x2="115.87" y2="108" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="122.89,104.16 115.87,108 122.89,111.84" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="259.29" y="101.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">2. Create one-shot reminder</text><text x="259.29" y="101.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">2. Create one-shot reminder</text></g><g class="d-arrow"><line x1="136.39" y1="152" x2="384.39" y2="152" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="377.37,155.84 384.39,152 377.37,148.16" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="261.39" y="145.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">3. Reminder fires</text><text x="261.39" y="145.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">3. Reminder fires</text></g><g class="d-arrow"><line x1="404.71" y1="196" x2="115.87" y2="196" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="122.89,192.16 115.87,196 122.89,199.84" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="259.29" y="189.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">6. Delete reminder</text><text x="259.29" y="189.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">6. Delete reminder</text></g><g class="d-arrow"><line x1="504.67" y1="126" x2="774.39" y2="126" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="767.37,129.84 774.39,126 767.37,122.16" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="643.39" y="119.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">4. Run workflow step</text><text x="643.39" y="119.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">4. Run workflow step</text></g><g class="d-arrow"><line x1="776.39" y1="178" x2="506.67" y2="178" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="513.69,174.16 506.67,178 513.69,181.84" stroke="var(--d-blue)" stroke-width="1.72" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="643.39" y="171.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">5. Send workflow step result</text><text x="643.39" y="171.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">5. Send workflow step result</text></g><g class="d-named-mark"><g class="d-mark-hex"><polygon points="82.69,90 136.39,121 136.39,183 82.69,214 29,183 29,121" fill="var(--d-diagram-plate)" stroke="var(--d-sky)" stroke-width="1.72" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(41.3602 110.6667) scale(0.1722)"><defs/><g id="ic-workflow-actor-reminder-flow-logo-blue-82_6936-152-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.618361,300.964459 96.7699392,300.964459 C87.3140802,300.964459 78.8968522,297.712348 71.5180026,291.208029 C62.7180414,283.446572 58.3181267,273.170995 58.3181267,260.380989 C58.3181267,247.372351 62.827356,236.987459 71.8459499,229.226003 C79.0061