<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 421" role="img" aria-labelledby="actors-game-example-title actors-game-example-desc"><title id="actors-game-example-title">An actor type, and the many actors of that type spread across two hosts</title><desc id="actors-game-example-desc">On the left, a large outlined circle titled Video Game Enemy. Under a rule inside it, two columns: State, listing X pos, Y pos, Z pos, Difficulty and Weapons; and Methods, listing Spawn() and Attack(). The circle is captioned Actor type. On the right, two dashed regions captioned Host/Pod, the upper holding seven green dots and the lower five. A dashed line runs from the dot nearest the circle to the circle, saying that each dot is one actor of that type.</desc><g class="d-region"><rect class="d-panel" x="345" y="27" width="360" height="170" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="365" y="14" width="82" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="406" y="31.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Host/Pod</text></g></g><g class="d-region"><rect class="d-panel" x="345" y="237" width="360" height="170" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="365" y="224" width="82" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="406" y="241.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Host/Pod</text></g></g><g class="d-arrow"><line x1="367" y1="142.6" x2="264.46" y2="177.59" stroke="var(--d-caption)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 5"/></g><g class="d-named-mark"><circle cx="149" cy="217" r="120" fill="var(--d-ground)" stroke="var(--d-blue)" stroke-width="1.4"/><text x="149" y="160.95" text-anchor="middle" font-size="17" font-weight="600" fill="var(--d-body)">Video Game Enemy</text><line x1="67" y1="179" x2="231" y2="179" stroke="var(--d-caption)" stroke-width="1.4"/><text x="67" y="201.55" text-anchor="start" font-size="13" font-weight="700" fill="var(--d-body)">State</text><text x="161" y="201.55" text-anchor="start" font-size="13" font-weight="700" fill="var(--d-body)">Methods</text><text x="67" y="220.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">X pos</text><text x="67" y="239.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Y pos</text><text x="67" y="258.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Z pos</text><text x="67" y="277.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Difficulty</text><text x="67" y="296.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Weapons</text><text x="161" y="220.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Spawn()</text><text x="161" y="239.55" text-anchor="start" font-size="13" font-weight="400" fill="var(--d-body)">Attack()</text><text x="149" y="367.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Actor type</text></g><g class="d-node"><circle cx="381" cy="142.6" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="438.6" cy="88.2" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="496.2" cy="163" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="532.2" cy="112" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="589.8" cy="71.2" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="633" cy="139.2" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="676.2" cy="95" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="409.8" cy="308.4" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="467.4" cy="359.4" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="525" cy="294.8" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="582.6" cy="345.8" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-node"><circle cx="647.4" cy="315.2" r="11" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
