<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 992 586" role="img" aria-labelledby="workflow-cross-app-client-title workflow-cross-app-client-desc"><title id="workflow-cross-app-client-title">One application terminating a workflow another application owns</title><desc id="workflow-cross-app-client-desc">Code in app-a asks its Dapr sidecar to terminate the instance order-1, naming app-b as the owning application. The sidecar passes the request to app-b's sidecar, carrying the caller identity over mTLS. App-b's sidecar checks its WorkflowAccessPolicy: whether app-a may terminate an OrderWF. If allowed, the operation reaches the order-1 instance, which only app-b runs. If denied, the caller gets PermissionDenied.</desc><g class="d-region"><rect class="d-panel" x="40" y="49" width="266" height="237" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="60" y="36" width="62" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round"/><text x="91" y="53.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">app-a</text></g></g><g class="d-region"><rect class="d-panel" x="404" y="49" width="548" height="497" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="424" y="36" width="62" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round"/><text x="455" y="53.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">app-b</text></g></g><g class="d-arrow"><line x1="173" y1="121" x2="173" y2="156" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="169.16,148.98 173,156 176.84,148.98" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="209" y1="196" x2="507" y2="196" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="499.98,199.84 507,196 499.98,192.16" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="358" y="182.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">caller identity over mTLS</text><text x="358" y="182.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">caller identity over mTLS</text></g><g class="d-arrow"><line x1="543" y1="236" x2="543" y2="312" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="539.16,304.98 543,312 546.84,304.98" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="543" y="300.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">may app-a terminate OrderWF?</text><text x="543" y="300.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">may app-a terminate OrderWF?</text></g><g class="d-arrow"><line x1="543" y1="416" x2="543" y2="474" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="539.16,466.98 543,474 546.84,466.98" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="555" y="454.2" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">allowed</text><text x="555" y="454.2" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">allowed</text></g><g class="d-elbow-arrow"><path class="d-run" d="M656,364 L807,364 Q819,364 819,376 L819,474" fill="none" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round"/><g class="d-arrow"><line x1="819" y1="448" x2="819" y2="474" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="815.16,466.98 819,474 822.84,466.98" stroke="var(--d-blue)" stroke-width="1.87" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="737.5" y="354.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">denied</text><text x="737.5" y="354.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">denied</text></g><g class="d-box"><rect x="66" y="75" width="214" height="46" rx="6" fill="var(--d-ground)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round"/><text x="173" y="94.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="173">Your code: terminate order-1</tspan><tspan x="173" dy="15.6">naming app-b</tspan></text></g><g class="d-decision"><polygon points="543,312 656,364 543,416 430,364" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round"/><text x="543" y="368.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">WorkflowAccessPolicy</text></g><g class="d-box"><rect x="436" y="474" width="214" height="46" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.87" stroke-linejoin="round" stroke-linecap="round"/><text x="543" y="501.55" text-anchor="middle" font-size="13" font-weight="600" fill="va