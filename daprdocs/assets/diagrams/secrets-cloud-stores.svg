<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.21 -0.2 709 340" role="img" aria-labelledby="secrets-cloud-stores-title secrets-cloud-stores-desc"><title id="secrets-cloud-stores-title">A service getting a secret from a configured cloud secret store through its Dapr sidecar</title><desc id="secrets-cloud-stores-desc">On the left, a green hexagon named App. A line with a head at each end joins it to a hexagon carrying the Dapr logo, named Dapr sidecar. A second such line joins the sidecar to a dashed area captioned Cloud secret stores, which holds the marks and names of four stores in two columns: AWS Secrets Manager, Azure Key Vault, Google Key Management and HashiCorp Vault. Below the service and its sidecar is a card holding the exchange between them: GET over the path /v1.0/secrets/vault/mysecret, and under it the value that comes back, mysecret "supersecret".</desc><g class="d-arrow"><line x1="134.92" y1="141" x2="216.43" y2="141" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="209.41,144.84 216.43,141 209.41,137.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="216.43" y1="141" x2="134.92" y2="141" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="141.94,137.16 134.92,141 141.94,144.84" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="303.57" y1="141" x2="395.57" y2="141" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="388.55,144.84 395.57,141 388.55,137.16" stroke="var(--d-blue)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="395.57" y1="141" x2="303.57" y2="141" stroke="var(--d-blue)" stroke-width="1.4" stroke