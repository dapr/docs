<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.4 1030 640" role="img" aria-labelledby="workflow-signing-failure-title workflow-signing-failure-desc"><title id="workflow-signing-failure-title">What Dapr does when workflow history verification fails</title><desc id="workflow-signing-failure-desc">A flow running down the middle: Load workflow state, then Verify signature chain plus attestations and lineage. Its Pass branch leaves sideways to Continue normal execution; its Fail branch goes down to a gold gate asking the failure type. The gate fans into three endings: Tamper, in-flight goes left to Append unsigned terminal event DAPR_WORKFLOW_HISTORY_TAMPERED plus delete reminders, which ends at Workflow surfaces as FAILED on next read; Tamper, completed or a metadata query goes down to Return error to reader; and ConfigurationError goes right to Return error to reader with no terminal append. The last two both end at State store NOT modified.</desc><g class="d-arrow"><line x1="515" y1="90" x2="515" y2="134" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="511.16,126.98 515,134 518.84,126.98" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="515" y1="212" x2="515" y2="288.4" stroke="var(--d-red)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="511.16,281.38 515,288.4 518.84,281.38" stroke="var(--d-red)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="525" y="238.2" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Fail</text><g><text x="515" y="276.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Failure type</text><text x="515" y="276.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Failure type</text></g><g class="d-arrow"><line x1="661" y1="174" x2="707" y2="174" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="699.98,177.84 707,174 699.98,170.16" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="685" y="164.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Pass</text><g class="d-elbow-arrow"><path class="d-run" d="M463,321.4 L187,321.4 Q175,321.4 175,333.4 L175,425.2" fill="none" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round"/><g class="d-arrow"><line x1="175" y1="399.2" x2="175" y2="425.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="171.16,418.18 175,425.2 178.84,418.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="319" y="311.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Tamper, in-flight</text><g class="d-arrow"><line x1="515" y1="352.4" x2="515" y2="425.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="511.16,418.18 515,425.2 518.84,418.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="525" y="371.4" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)"><tspan x="525">Tamper, completed</tspan><tspan x="525" dy="14.4">or metadata query path</tspan></text><g class="d-elbow-arrow"><path class="d-run" d="M567,321.4 L843,321.4 Q855,321.4 855,333.4 L855,425.2" fill="none" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round"/><g class="d-arrow"><line x1="855" y1="399.2" x2="855" y2="425.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="851.16,418.18 855,425.2 858.84,418.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="711" y="311.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">ConfigurationError</text><g class="d-arrow"><line x1="175" y1="503.2" x2="175" y2="547.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="171.16,540.18 175,547.2 178.84,540.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M515,503.2 L515,514.7 Q515,526.2 526.5,526.2 L674.5,526.2 Q685,526.2 685,536.7 L685,547.2" fill="none" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round"/><g class="d-arrow"><line x1="685" y1="536.7" x2="685" y2="547.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="681.16,540.18 685,547.2 688.84,540.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-elbow-arrow"><path class="d-run" d="M855,503.2 L855,514.7 Q855,526.2 843.5,526.2 L695.5,526.2 Q685,526.2 685,536.7 L685,547.2" fill="none" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round"/><g class="d-arrow"><line x1="685" y1="536.7" x2="685" y2="547.2" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="681.16,540.18 685,547.2 688.84,540.18" stroke="var(--d-blue)" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-box"><rect x="369" y="14" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="515" y="56.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Load workflow state</text></g><g class="d-box"><rect x="369" y="136" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="515" y="170.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="515">Verify signature chain</tspan><tspan x="515" dy="15.6">+ attestations + lineage</tspan></text></g><g class="d-box"><rect x="709" y="136" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="855" y="170.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="855">Continue normal</tspan><tspan x="855" dy="15.6">execution</tspan></text></g><g class="d-decision"><polygon points="515,290.4 567,321.4 515,352.4 463,321.4" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-box"><rect x="29" y="427.2" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="175" y="454.15" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="175">Append unsigned terminal event</tspan><tspan x="175" dy="15.6">(DAPR_WORKFLOW_HISTORY_TAMPERED)</tspan><tspan x="175" dy="15.6">+ delete reminders</tspan></text></g><g class="d-box"><rect x="369" y="427.2" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="515" y="461.95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="515">Return error</tspan><tspan x="515" dy="15.6">to reader</tspan></text></g><g class="d-box"><rect x="709" y="427.2" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="855" y="461.95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="855">Return error to reader</tspan><tspan x="855" dy="15.6">(no terminal append)</tspan></text></g><g class="d-box"><rect x="29" y="549.2" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="175" y="583.95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="175">Workflow surfaces as</tspan><tspan x="175" dy="15.6">FAILED on next read</tspan></text></g><g class="d-box"><rect x="539" y="549.2" width="292" height="76" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.95" stroke-linejoin="round" stroke-linecap="round"/><text x="685" y="583.95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="685">State store</tspan><tspan x="685" dy="15.6">NOT modified</tspan></text></g></svg>
