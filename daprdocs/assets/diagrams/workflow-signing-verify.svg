<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.1 994 1153" role="img" aria-labelledby="workflow-signing-verify-title workflow-signing-verify-desc"><title id="workflow-signing-verify-title">How Dapr verifies a workflow history signature chain when state is loaded</title><desc id="workflow-signing-verify-desc">A flow running down the middle: Load workflow state from state store, then a gold gate asking whether signatures are present. With no signatures but a signer configured and history present it refuses the load; with no signer configured it continues without verification. With signatures present a second gate asks whether a signer is configured, and refuses the load if not. Otherwise a dashed lane, for each signature in the chain, holds seven checks in order: verify chain linkage, verify event range contiguity, recompute the events digest from raw bytes, verify the cryptographic signature, validate the certificate time window, verify certificate chain-of-trust to the CA, and verify the SPIFFE app identity. A red bus down the right-hand side collects a failure from every one of them - mismatch, gap, mismatch, failed, expired, untrusted, wrong app - and ends at Verification failed. Below the lane a last gate asks whether all events are covered: yes ends at Verification passed, no joins the failed end.</desc><g class="d-arrow"><line x1="450" y1="82" x2="450" y2="158.4" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,151.38 450,158.4 453.84,151.38" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="450" y="146.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Signatures present?</text><text x="450" y="146.6" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Signatures present?</text></g><g class="d-arrow"><line x1="450" y1="222.4" x2="450" y2="298.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,291.78 450,298.8 453.84,291.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="460" y="248.6" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Yes</text><g><text x="450" y="287" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Signer configured?</text><text x="450" y="287" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Signer configured?</text></g><g class="d-arrow"><line x1="450" y1="362.8" x2="450" y2="432.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,425.78 450,432.8 453.84,425.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="460" y="389" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Yes</text><g class="d-arrow"><line x1="398" y1="191.4" x2="281" y2="191.4" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="288.02,187.56 281,191.4 288.02,195.24" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="338.5" y="152.8" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)"><tspan x="338.5">No, but signer</tspan><tspan x="338.5" dy="14.4">configured and</tspan><tspan x="338.5" dy="14.4">history exists</tspan></text><g class="d-arrow"><line x1="502" y1="191.4" x2="713" y2="191.4" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="705.98,195.24 713,191.4 705.98,187.56" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="608.5" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)"><tspan x="608.5">No, signer</tspan><tspan x="608.5" dy="14.4">not configured</tspan></text><g class="d-arrow"><line x1="398" y1="331.8" x2="281" y2="331.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="288.02,327.96 281,331.8 288.02,335.64" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="338.5" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">No</text><g class="d-arrow"><line x1="450" y1="482.8" x2="450" y2="500.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,493.78 450,500.8 453.84,493.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="550.8" x2="450" y2="568.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,561.78 450,568.8 453.84,561.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="618.8" x2="450" y2="636.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,629.78 450,636.8 453.84,629.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="686.8" x2="450" y2="704.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,697.78 450,704.8 453.84,697.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="754.8" x2="450" y2="772.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,765.78 450,772.8 453.84,765.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="822.8" x2="450" y2="840.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,833.78 450,840.8 453.84,833.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="685" y1="458.8" x2="685" y2="866.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="575" y1="458.8" x2="685" y2="458.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="451" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Mismatch</text><text x="611" y="451" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Mismatch</text></g><g class="d-arrow"><line x1="575" y1="526.8" x2="685" y2="526.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="519" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Gap</text><text x="611" y="519" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Gap</text></g><g class="d-arrow"><line x1="575" y1="594.8" x2="685" y2="594.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="587" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Mismatch</text><text x="611" y="587" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Mismatch</text></g><g class="d-arrow"><line x1="575" y1="662.8" x2="685" y2="662.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="655" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Failed</text><text x="611" y="655" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Failed</text></g><g class="d-arrow"><line x1="575" y1="730.8" x2="685" y2="730.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="723" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Expired</text><text x="611" y="723" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Expired</text></g><g class="d-arrow"><line x1="575" y1="798.8" x2="685" y2="798.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="791" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Untrusted</text><text x="611" y="791" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Untrusted</text></g><g class="d-arrow"><line x1="575" y1="866.8" x2="685" y2="866.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="611" y="859" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Wrong app</text><text x="611" y="859" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Wrong app</text></g><g class="d-arrow"><line x1="685" y1="662.8" x2="713" y2="662.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="705.98,666.64 713,662.8 705.98,658.96" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450" y1="890.8" x2="450" y2="960.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,953.78 450,960.8 453.84,953.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="450" y="949" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">All events covered?</text><text x="450" y="949" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">All events covered?</text></g><g class="d-arrow"><line x1="450" y1="1024.8" x2="450" y2="1068.8" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="446.16,1061.78 450,1068.8 453.84,1061.78" stroke="var(--d-blue)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="460" y="1051" text-anchor="start" font-size="12" font-weight="500" fill="var(--d-caption)">Yes</text><g class="d-elbow-arrow"><path class="d-run" d="M502,993.8 L828,993.8 Q840,993.8 840,981.8 L840,698.8" fill="none" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round"/><g class="d-arrow"><line x1="840" y1="724.8" x2="840" y2="698.8" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="843.84,705.82 840,698.8 836.16,705.82" stroke="var(--d-red)" stroke-width="1.88" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="671" y="984" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">No</text><g class="d-region"><rect class="d-panel" x="269" y="408.8" width="332" height="508" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="289" y="395.8" width="136" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="357" y="413.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">For each signature</text></g></g><g class="d-box"><rect x="325" y="14" width="250" height="68" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="44.75" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="450">Load workflow state</tspan><tspan x="450" dy="15.6">from state store</tspan></text></g><g class="d-decision"><polygon points="450,160.4 502,191.4 450,222.4 398,191.4" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-decision"><polygon points="450,300.8 502,331.8 450,362.8 398,331.8" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-decision"><polygon points="450,962.8 502,993.8 450,1024.8 398,993.8" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-box"><rect x="29" y="157.4" width="250" height="68" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="154" y="188.15" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="154">FAIL: unsigned history cannot</tspan><tspan x="154" dy="15.6">be loaded with signing enabled</tspan></text></g><g class="d-box"><rect x="29" y="297.8" width="250" height="68" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="154" y="328.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="154">FAIL: signed history cannot</tspan><tspan x="154" dy="15.6">be loaded without a signer</tspan></text></g><g class="d-box"><rect x="715" y="157.4" width="250" height="68" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="840" y="195.95" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Continue without verification</text></g><g class="d-box"><rect x="325" y="434.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="463.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verify chain linkage</text></g><g class="d-box"><rect x="325" y="502.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="531.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verify event range contiguity</text></g><g class="d-box"><rect x="325" y="570.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="591.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="450">Recompute events digest</tspan><tspan x="450" dy="15.6">from raw bytes</tspan></text></g><g class="d-box"><rect x="325" y="638.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="667.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verify cryptographic signature</text></g><g class="d-box"><rect x="325" y="706.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="735.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Validate certificate time window</text></g><g class="d-box"><rect x="325" y="774.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="795.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)"><tspan x="450">Verify certificate</tspan><tspan x="450" dy="15.6">chain-of-trust to CA</tspan></text></g><g class="d-box"><rect x="325" y="842.8" width="250" height="48" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="871.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verify SPIFFE app identity</text></g><g class="d-box"><rect x="715" y="628.8" width="250" height="68" rx="6" fill="var(--d-ground)" fill-opacity="0.6" stroke="var(--d-red)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="840" y="667.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verification failed</text></g><g class="d-box"><rect x="325" y="1070.8" width="250" height="68" rx="6" fill="var(--d-teal-fill)" fill-opacity="0.6" stroke="var(--d-teal)" stroke-width="1.88" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="1109.35" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Verification passed</text></g></svg>
