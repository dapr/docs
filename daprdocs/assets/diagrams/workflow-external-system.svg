ue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="859.02,337.16 852,341 859.02,344.84" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></g><g><text x="442.5" y="329.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Is Approved</text><text x="442.5" y="403.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Is Rejected</text><text x="442.5" y="477.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)">Is TimeOut</text></g><g class="d-arrow"><line x1="214" y1="163" x2="103" y2="163" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="110.02,159.16 103,163 110.02,166.84" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-arrow-step-in-right" transform="translate(44.8 137.7727) scale(2.1)" fill="var(--d-sky)" color="var(--d-sky)"><path fill="currentColor" d="M8.706 16.234a.75.75 0 1 0 1.088 1.032l4.5-4.75a.75.75 0 0 0 0-1.032l-4.5-4.75a.75.75 0 0 0-1.088 1.032l3.3 3.484H2.75a.75.75 0 0 0 0 1.5h9.256zM22 12a3 3 0 1 0-6 0a3 3 0 0 0 6 0m-1.5 0a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0"/></g></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-person" transform="translate(48 205) scale(1.8333)" fill="var(--d-blue)" color="var(--d-blue)"><path fill="currentColor" d="M17.755 14a2.25 2.25 0 0 1 2.248 2.25v.575c0 .894-.32 1.759-.9 2.438c-1.57 1.833-3.957 2.738-7.103 2.738s-5.532-.905-7.098-2.74a3.75 3.75 0 0 1-.898-2.434v-.578A2.25 2.25 0 0 1 6.253 14zm0 1.5H6.252a.75.75 0 0 0-.75.75v.577c0 .535.192 1.053.54 1.46c1.253 1.469 3.22 2.214 5.957 2.214c2.739 0 4.706-.745 5.963-2.213a2.25 2.25 0 0 0 .54-1.463v-.576a.75.75 0 0 0-.748-.749M12 2.005a5 5 0 1 1 0 10a5 5 0 0 1 0-10m0 1.5a3.5 3.5 0 1 0 0 7