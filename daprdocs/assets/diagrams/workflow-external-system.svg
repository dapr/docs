<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.5 0 944 552" role="img" aria-labelledby="workflow-external-system-title workflow-external-system-desc"><title id="workflow-external-system-title">The external system interaction workflow pattern</title><desc id="workflow-external-system-desc">A workflow requests an approval, then pauses waiting for an external event. A person raises the approval event. The workflow then branches on whether the order was approved, rejected, or timed out, running the matching activity before it ends.</desc><g><g class="d-arrow"><line x1="300" y1="100" x2="300" y2="140" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="296.16,132.98 300,140 303.84,132.98" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="300" y1="186" x2="300" y2="214" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="296.16,206.98 300,214 303.84,206.98" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="300" y1="260" x2="300" y2="304" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="296.16,296.98 300,304 303.84,296.98" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><g class="d-arrow"><line x1="355" y1="341" x2="530" y2="341" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="522.98,344.84 530,341 522.98,337.16" stroke="var(--d-blue)" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M300,378 L300,403 Q300,415 312,415 L530,415" fill="none" stroke="var(--d-blue)" stroke-width="