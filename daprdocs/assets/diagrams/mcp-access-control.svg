<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.18 -6.9 1135 270" role="img" aria-labelledby="mcp-access-control-title mcp-access-control-desc"><title id="mcp-access-control-title">How App-ID gating and OPA middleware guard an MCP server</title><desc id="mcp-access-control-desc">On the left, an app hexagon named Agent / MCP client. It sends an HTTP card reading POST /method/mcp with a dapr-caller-app-id header into a lane named Dapr sidecar, MCP server side, which holds two gold gates: the accessControl App-ID gate and, after it, the OPA middleware tool-level gate. An allow from the first reaches the second, and an allow from the second reaches the app hexagon named MCP server on the right. Either gate can refuse instead, and each refusal returns a 403 to the lower point of the agent hexagon along a red dashed run beneath the flow. The App-ID gate runs before any middleware, so a disallowed caller never reaches the OPA gate at all.</desc><g class="d-region"><rect class="d-panel" x="441.32" y="26" width="400" height="165.2" rx="10" fill="none" stroke="var(--d-caption)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="461.32" y="13" width="224" height="26" rx="13" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/><text x="573.32" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Dapr sidecar - MCP server side</text></g></g><g class="d-arrow"><line x1="143.32" y1="133.2" x2="185.32" y2="133.2" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="178.29,137.04 185.32,133.2 178.29,129.36" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="399.32" y1="133.2" x2="465.32" y2="133.2" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="458.29,137.04 465.32,133.2 458.29,129.36" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="523.32" y="80.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="523.32">accessControl</tspan><tspan x="523.32" dy="14.4">App-ID gate</tspan></text><text x="523.32" y="80.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)"><tspan x="523.32">accessControl</tspan><tspan x="523.32" dy="14.4">App-ID gate</tspan></text></g><g class="d-arrow"><line x1="579.32" y1="133.2" x2="701.32" y2="133.2" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="694.29,137.04 701.32,133.2 694.29,129.36" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="641.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">allow</text><text x="641.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">allow</text></g><g><text x="759.32" y="80.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="759.32">OPA middleware</tspan><tspan x="759.32" dy="14.4">tool-level gate</tspan></text><text x="759.32" y="80.2" text-anchor="middle" font-size="12" font-weight="500" fill="var(--d-caption)"><tspan x="759.32">OPA middleware</tspan><tspan x="759.32" dy="14.4">tool-level gate</tspan></text></g><g class="d-arrow"><line x1="815.32" y1="133.2" x2="989.32" y2="133.2" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="982.29,137.04 989.32,133.2 982.29,129.36" stroke="var(--d-blue)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="903.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">allow</text><text x="903.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--d-caption)">allow</text></g><g class="d-elbow-arrow"><path class="d-run" d="M759.32,165.2 L759.32,231.2 Q759.32,243.2 747.32,243.2 L98.16,243.2 Q86.16,243.2 86.16,231.2 L86.16,201.2" fill="none" stroke="var(--d-red)" stroke-width="2.14" stroke-linecap="round" stroke-dasharray="6 5"/><g class="d-arrow"><line x1="86.16" y1="222.2" x2="86.16" y2="201.2" stroke="var(--d-red)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="89.99,208.22 86.16,201.2 82.32,208.22" stroke="var(--d-red)" stroke-width="2.14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="769.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">403</text><text x="769.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-caption)">403</text></g><g class="d-elbow-arrow"><path class="d-run" d="M523.32,165.2 L523.32,243.2" fill="none" stroke="var(--d-red)" stroke-width="2.14" stroke-linecap="round" stroke-dasharray="6 5"/></g><g><text x="533.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-ground)" stroke="var(--d-ground)" stroke-width="4" stroke-linejoin="round" aria-hidden="true">403</text><text x="533.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="var(--d-caption)">403</text></g><g class="d-hex d-hex-solid"><polygon points="86.16,67.2 143.32,100.2 143.32,166.2 86.16,199.2 29,166.2 29,100.2" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/><text x="86.16" y="129.45" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-app-ink)"><tspan x="86.16">Agent /</tspan><tspan x="86.16" dy="18">MCP client</tspan></text></g><g class="d-http-card"><rect x="187.32" y="70.7" width="210" height="125" rx="10" fill="var(--d-ground)" stroke="var(--d-caption)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/><text x="292.32" y="105.57" text-anchor="middle" font-size="13" font-weight="700" fill="var(--d-sky)">POST</text><text x="292.32" y="128.32" text-anchor="middle" font-size="13" font-weight="400" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="var(--d-body)"><tspan>/method/mcp</tspan></text><text x="292.32" y="155.63" text-anchor="middle" font-size="13" font-weight="400" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="var(--d-body)">dapr-caller-app-id</text></g><g class="d-decision"><polygon points="523.32,101.2 579.32,133.2 523.32,165.2 467.32,133.2" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-decision"><polygon points="759.32,101.2 815.32,133.2 759.32,165.2 703.32,133.2" fill="var(--d-app-gold)" fill-opacity="0.6" stroke="var(--d-app-ink)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-hex d-hex-solid"><polygon points="1048.47,67.2 1105.63,100.2 1105.63,166.2 1048.47,199.2 991.32,166.2 991.32,100.2" fill="var(--d-app-sky)" stroke="var(--d-app-ink)" stroke-width="2.14" stroke-linejoin="round" stroke-linecap="round"/><text x="1048.47" y="138.45" text-anchor="middle" font-size="15" font-weight="600" fill="var(--d-app-paper)">MCP server</text></g></svg>
