<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.47 -8 1247 368" role="img" aria-labelledby="pubsub-deadletter-title pubsub-deadletter-desc"><title id="pubsub-deadletter-title">A message that fails delivery being forwarded to a dead letter topic</title><desc id="pubsub-deadletter-desc">On the left, a green hexagon named Publisher, with step one beside it reading Message sent. An arrow runs from it to a message broker named orders, and on to a hexagon carrying the Dapr logo, named Dapr sidecar. From the sidecar one run rises and turns down into the top point of a blue hexagon named Subscriber on the right: it is dashed and red, labelled /checkout, with a red cross above it and step two reading Delivery fails, after retries. A second run drops from the sidecar, passes through a second broker named poisonMessages, and turns up into the bottom point of the Subscriber, labelled /failedMessages, with step three reading Dead letter topic delivery.</desc><g class="d-arrow"><line x1="134.92" y1="179" x2="266.92" y2="179" stroke="var(--d-blue)" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="259.9,182.84 266.92,179 259.9,175.16" stroke="var(--d-blue)" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-named-mark"><g class="d-step"><circle cx="149.92" cy="138" r="15" fill="var(--d-app-blue)" stroke="var(--d-app-blue)" stroke-width="2.36" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="149.92" y="142.99" text-anchor="middle" font-size="14.25" font-weight="600" fill="var(--d-app-paper)">1</text></g></g><text x="222.92" y="142.55" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-body)">Message sent</text></g><g class="d-arrow"><line x1="462.92" y1="179" x2="556.92" y2="179" stroke="var(--d-blue)" stroke-width="2.36" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="549.9,182.84 556.92,179 549.9,175.16" strok