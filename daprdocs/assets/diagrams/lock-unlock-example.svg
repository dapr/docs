<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2.84 830 454" role="img" aria-labelledby="lock-unlock-example-title lock-unlock-example-desc"><title id="lock-unlock-example-title">One instance releasing its lock so the other can update the resource</title><desc id="lock-unlock-example-desc">Two green hexagons, one above the other, both named App 1 and captioned Instance 1 and Instance 2, each with a hexagon carrying the Dapr logo overlapping its lower right corner. From the upper Dapr hexagon a line runs right and turns down into the top of a gold data-store cylinder named Shared resource; beside it a numbered step 1, an open padlock, and the words "Release lock on resource". From the lower Dapr hexagon a line runs right and turns up into the foot of the same store; beside it a numbered step 2, a tick in a circle, and the words "Other apps can update the resource".</desc><g class="d-elbow-arrow"><path class="d-run" d="M160.9,143 L729,143 Q741,143 741,155 L741,201.5" fill="none" stroke="var(--d-blue)" stroke-width="1.57" stroke-linecap="round"/><g class="d-arrow"><line x1="741" y1="175.5" x2="741" y2="201.5" stroke="var(--d-blue)" stroke-width="1.57" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="737.16,194.48 741,201.5 744.84,194.48" stroke="var(--d-blue)" stroke-width="1.57" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-step"><circle cx="213.9" cy="103" r="15" fill="var(--d-app-blue)" stroke="var(--d-app-blue)" stroke-width="1.57" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="213.9" y="107.99" text-anchor="middle" font-size="14.25" font-weight="600" fill="var(--d-app-paper)">1</text></g></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-lock-open" transform="translate(237.3297 83.2857) scale(1.7143)" fill="var(--d-blue)" color="var(--d-blue)"><path fill="currentColor" d="M18.75 1a4.75 4.75 0 0 1 4.75 4.75v.5a.75.75 0 0 1-1.5 0v-.5a3.25 3.25 0 0 0-6.5 0V