<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -7.5 980 344" role="img" aria-labelledby="security-end-to-end-title security-end-to-end-desc"><title id="security-end-to-end-title">End-to-end security on a call between two Dapr applications</title><desc id="security-end-to-end-desc">Two applications, App A on the left in green and App B on the right in blue, each joined to its own Dapr sidecar by a line with an arrowhead at each end, and the two sidecars joined to each other by a third such line. Each app-to-sidecar link is labelled "API token" above the line, and below it the two tokens that guard it: DAPR_API_TOKEN for calls into Dapr and APP_API_TOKEN for calls back to the app. Between the two sidecars a shield-and-padlock mark is labelled "mTLS, on by default". Above the picture a dashed region captioned "Checked by the sidecar" lists service access policies, with endpoint allow and deny lists, and pub/sub topic access policies, with topic allow and deny lists; a dashed leader runs from it to each of the two sidecars.</desc><g class="d-hex d-hex-solid"><polygon points="95,190 143.5,218 143.5,274 95,302 46.5,274 46.5,218" fill="var(--d-green)" stroke="var(--d-app-ink)" stroke-width="1.85" stroke-linejoin="round" stroke-linecap="round"/><text x="95" y="252.53" text-anchor="middle" font-size="18.67" font-weight="600" fill="var(--d-app-ink)">App A</text></g><g class="d-mark-hex"><polygon points="325,202 363.11,224 363.11,268 325,290 286.89,268 286.89,224" fill="var(--d-diagram-plate)" stroke="var(--d-sky)" stroke-width="1.85" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(295.6667 216.6667) scale(0.1222)"><defs/><g id="ic-security-end-to-end-logo-blue-325-246-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.6