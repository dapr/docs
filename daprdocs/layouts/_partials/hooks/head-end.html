<!-- Dapr theme: set data-bs-theme before first paint to avoid a flash of the wrong theme. -->
<script>
  (function () {
    try {
      var s = localStorage.getItem("dapr-theme");
      var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-bs-theme", d ? "dark" : "light");
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="/css/cookie-banner.css" />

<!-- Reo analytics (loaded only with cookie consent) -->
<script>
(function () {
  var COOKIE_NAME = "dapr_cookie_consent";

  function readConsent() {
    var prefix = COOKIE_NAME + "=";
    var parts = document.cookie ? document.cookie.split("; ") : [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].indexOf(prefix) === 0) {
        return parts[i].substring(prefix.length);
      }
    }
    return null;
  }

  var injected = false;
  window.daprInjectReo = function () {
    if (injected) { return; }
    injected = true;
    var clientId = "5901cc15fcf7e10";
    var onLoad = function () { Reo.init({ clientID: clientId }); };
    var s = document.createElement("script");
    s.src = "https://static.reo.dev/" + clientId + "/reo.js";
    s.defer = true;
    s.onload = onLoad;
    document.head.appendChild(s);
  };

  if (readConsent() === "accepted") {
    window.daprInjectReo();
  }
})();
</script>
