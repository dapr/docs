<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="-0.02 -6.8 1200 453" role="img" aria-labelledby="workflows-architecture-k8s-title workflows-architecture-k8s-desc"><title id="workflows-architecture-k8s-title">The Dapr Workflow architecture in Kubernetes mode</title><desc id="workflows-architecture-k8s-desc">One app pod. Inside it on the left, a region named Sidecar holding the workflow actor and the activity actor, both internal and both drawn as circles, and the Dapr workflow engine. The engine processes workflow events on the workflow actor and invokes activity code on the activity actor. Inside the pod on the right, a region named Workflow App holding a region named Workflow code, which holds the Dapr Workflow SDK. A single gRPC stream joins the engine to the SDK: the app initiates the stream, the sidecar sends state and work items, and the app sends results and next steps back. Inbound and outbound Dapr API calls reach the sidecar from outside the pod.</desc><g class="d-region"><rect class="d-panel" x="243" y="26" width="927.96" height="400.4" rx="8" fill="none" stroke="#3ea9f5" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="263" y="13" width="76" height="26" rx="13" fill="#ffffff" stroke="#3ea9f5" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round"/><text x="301" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">App pod</text></g></g><g class="d-region"><rect class="d-panel" x="273" y="74" width="416.28" height="322.4" rx="10" fill="none" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="293" y="61" width="74" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="78.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Sidecar</text></g></g><g class="d-region"><rect class="d-panel" x="941.28" y="88.6" width="199.67" height="230" rx="10" fill="none" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="961.28" y="75.6" width="114" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round"/><text x="1018.28" y="93.15" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Workflow App</text></g></g><g class="d-region"><rect class="d-panel" x="971.28" y="136.6" width="139.67" height="152" rx="10" fill="none" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="991.28" y="123.6" width="120" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="round"/><text x="1051.28" y="141.15" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Workflow code</text></g></g><g class="d-arrow"><line x1="29" y1="136" x2="271" y2="136" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="263.98,139.84 271,136 263.98,132.16" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="136" y="128.55" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">inbound Dapr API calls</text><text x="136" y="128.55" text-anchor="middle" font-size="13" font-weight="500" fill="#747474">inbound Dapr API calls</text></g><g class="d-arrow"><line x1="273" y1="289.2" x2="31" y2="289.2" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="38.02,285.36 31,289.2 38.02,293.04" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="136" y="281.75" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">outbound Dapr API calls</text><text x="136" y="281.75" text-anchor="middle" font-size="13" font-weight="500" fill="#747474">outbound Dapr API calls</text></g><g class="d-elbow-arrow"><path class="d-run" d="M590,212.6 L558,212.6 Q546,212.6 546,200.6 L546,148 Q546,136 534,136 L396,136" fill="none" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round"/><g class="d-arrow"><line x1="422" y1="136" x2="396" y2="136" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="403.02,132.16 396,136 403.02,139.84" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="480" y="128.55" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Process workflow events</text><text x="480" y="128.55" text-anchor="middle" font-size="13" font-weight="500" fill="#747474">Process workflow events</text></g><g class="d-elbow-arrow"><path class="d-run" d="M590,212.6 L558,212.6 Q546,212.6 546,224.6 L546,277.2 Q546,289.2 534,289.2 L396,289.2" fill="none" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round"/><g class="d-arrow"><line x1="422" y1="289.2" x2="396" y2="289.2" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="403.02,285.36 396,289.2 403.02,293.04" stroke="#0D2192" stroke-width="2.27" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="480" y="313.55" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Invoke activity code</text><text x="480" y="313.55" text-