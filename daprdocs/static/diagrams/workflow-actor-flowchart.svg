<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 414" role="img" aria-labelledby="workflow-actor-flowchart-title workflow-actor-flowchart-desc"><title id="workflow-actor-flowchart-title">The lifecycle of a Dapr workflow actor</title><desc id="workflow-actor-flowchart-desc">A cycle of five states. A green Start terminal points down into Message received, which leads right to Execute workflow code, then down the right-hand side to Schedule tasks, then back left to Save state, then left to Idle, and from Idle up the left-hand side to Message received again. There is no end: the actor goes idle and waits for the next message, and may be unloaded from memory while it waits.</desc><g class="d-arrow"><line x1="115" y1="74" x2="115" y2="112" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="111.16,104.98 115,112 118.84,104.98" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="201" y1="143" x2="289" y2="143" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="281.98,146.84 289,143 281.98,139.16" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M463,143 L627,143 Q639,143 639,155 L639,226" fill="none" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round"/><g class="d-arrow"><line x1="639" y1="200" x2="639" y2="226" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="635.16,218.98 639,226 642.84,218.98" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-elbow-arrow"><path class="d-run" d="M639,286 L639,359 Q639,371 627,371 L465,371" fill="none" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round"/><g class="d-arrow"><line x1="491" y1="371" x2="465" y2="371" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="472.02,367.16 465,371 472.02,374.84" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-arrow"><line x1="291" y1="371" x2="203" y2="371" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="210.02,367.16 203,371 210.02,374.84" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="115" y1="342" x2="115" y2="174" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="118.84,181.02 115,174 111.16,181.02" stroke="#0D2192" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-node"><circle cx="115" cy="44" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="115" y="48.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-box"><rect x="29" y="114" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><text x="115" y="147.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Message received</text></g><g class="d-box"><rect x="291" y="114" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><text x="377" y="147.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Execute workflow code</text></g><g class="d-box"><rect x="553" y="228" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><text x="639" y="261.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Schedule tasks</text></g><g class="d-box"><rect x="291" y="342" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><text x="377" y="375.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Save state</text></g><g class="d-box"><rect x="29" y="342" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.42" stroke-linejoin="round" stroke-linecap="round"/><text x="115" y="375.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Idle</text></g></svg>
