<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.2 816 500" role="img" aria-labelledby="workflow-stateful-client-title workflow-stateful-client-desc"><title id="workflow-stateful-client-title">How a workflow worker decides what to replay when a work item arrives</title><desc id="workflow-stateful-client-desc">A flow running down the left column: a box, Work item arrives, down to a gold gate asking whether cachedHistory is set; its Yes (delta send) branch goes down to a second gate asking whether the cached events match cachedHistory.eventCount, and that gate’s Yes branch ends at Replay cached prefix plus the delta. Each No leaves its gate sideways: No (full send) goes right to Replay pastEvents as the full history, and No (cache miss) goes right to Fetch the full history via GetInstanceHistory, which ends either at Replay the fetched history on success or at Drop the stream so the turn is redelivered to a cold stream on failure.</desc><g class="d-arrow"><line x1="140" y1="72" x2="140" y2="162.8" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="136.16,155.78 140,162.8 143.84,155.78" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="140" y="151" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Is cachedHistory set?</text><text x="140" y="151" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Is cachedHistory set?</text></g><g class="d-arrow"><line x1="140" y1="226.8" x2="140" y2="317.6" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="136.16,310.58 140,317.6 143.84,310.58" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="150" y="253" text-anchor="start" font-size="12" font-weight="500" fill="#747474">Yes (delta send)</text><g><text x="140" y="291.4" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="140">Do the cached events match</tspan><tspan x="140" dy="14.4">cachedHistory.eventCount?</tspan></text><text x="140" y="291.4" text-anchor="middle" font-size="12" font-weight="500" fill="#747474"><tspan x="140">Do the cached events match</tspan><tspan x="140" dy="14.4">cachedHistory.eventCount?</tspan></text></g><g class="d-arrow"><line x1="140" y1="381.6" x2="140" y2="425.6" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="136.16,418.58 140,425.6 143.84,418.58" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="150" y="407.8" text-anchor="start" font-size="12" font-weight="500" fill="#747474">Yes</text><g class="d-arrow"><line x1="186" y1="195.8" x2="295" y2="195.8" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="287.98,199.64 295,195.8 287.98,191.96" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="241.5" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">No (full send)</text><g class="d-arrow"><line x1="186" y1="350.6" x2="295" y2="350.6" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="287.98,354.44 295,350.6 287.98,346.76" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="241.5" y="340.8" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">No (cache miss)</text><g class="d-arrow"><line x1="408" y1="379.6" x2="408" y2="425.6" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="404.16,418.58 408,425.6 411.84,418.58" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="418" y="405.8" text-anchor="start" font-size="12" font-weight="500" fill="#747474">Success</text><g class="d-elbow-arrow"><path class="d-run" d="M521,350.6 L664,350.6 Q676,350.6 676,362.6 L676,425.6" fill="none" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round"/><g class="d-arrow"><line x1="676" y1="399.6" x2="676" y2="425.6" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="672.16,418.58 676,425.6 679.84,418.58" stroke="#0D2192" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="597.5" y="340.8" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Failure</text><g class="d-box"><rect x="29" y="14" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="47.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Work item arrives</text></g><g class="d-decision"><polygon points="140,164.8 186,195.8 140,226.8 94,195.8" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-decision"><polygon points="140,319.6 186,350.6 140,381.6 94,350.6" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-box"><rect x="29" y="427.6" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="453.35" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="140">Replay cached prefix</tspan><tspan x="140" dy="15.6">plus the delta</tspan></text></g><g class="d-box"><rect x="297" y="166.8" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="408" y="192.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="408">Replay pastEvents</tspan><tspan x="408" dy="15.6">as the full history</tspan></text></g><g class="d-box"><rect x="297" y="321.6" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="408" y="347.35" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="408">Fetch the full history</tspan><tspan x="408" dy="15.6">via GetInstanceHistory</tspan></text></g><g class="d-box"><rect x="297" y="427.6" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="408" y="461.15" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Replay the fetched history</text></g><g class="d-box"><rect x="565" y="427.6" width="222" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/><text x="676" y="453.35" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="676">Drop the stream so the turn</tspan><tspan x="676" dy="15.6">is redelivered to a cold stream</tspan></text></g></svg>
