<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.05 894 432" role="img" aria-labelledby="secrets-mgmt-overview-title secrets-mgmt-overview-desc"><title id="secrets-mgmt-overview-title">A service retrieving a secret through its Dapr sidecar from a local secret store</title><desc id="secrets-mgmt-overview-desc">Along the top, three shapes in a row: a green hexagon named Order Processor, a hexagon carrying the Dapr logo named Dapr sidecar, and a padlock in a box named Secret store. A line with a head at each end joins each to the next. Under the service and its sidecar is the call it makes: GET over the path /v1.0/secrets/localsecretstore/secret. Along the bottom, under the shape each configures, are three cards. Order Processor service holds SECRET_STORE_NAME set to localsecretstore and SECRET_NAME set to secret. local-secret-store.yaml holds a component named localsecretstore, of type secretstores.local.file, whose metadata sets secretsFile to secrets.json. secrets.json holds the key secret with the value Order Processing pass key.</desc><g class="d-arrow"><line x1="177.96" y1="74" x2="342.43" y2="74" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="335.41,77.84 342.43,74 335.41,70.16" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="342.43" y1="74" x2="177.96" y2="74" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="184.98,70.16 177.96,74 184.98,77.84" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="429.57" y1="74" x2="679" y2="74" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="671.98,77.84 679,74 671.98,70.16" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="679" y1="74" x2="429.57" y2="74" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="436.59,70.16 429.57,74 436.59,77.84" stroke="#0D2192" stroke-width="1.69" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-hex d-hex-solid"><polygon points="124,14 175.96,44 175.96,104 124,134 72.04,104 72.04,44" fill="#0bdda3" stroke="#11161f" stroke-width="1.69" stroke-linejoin="round" stroke-linecap="round"/><text x="124" y="69.75" text-anchor="middle" font-size="17" font-weight="600" fill="#11161f"><tspan x="124">Order</tspan><tspan x="124" dy="20.4">Processor</tspan></text></g><g class="d-named-mark"><g class="d-mark-hex"><polygon points="386,26 427.57,50 427.57,98 386,122 344.43,98 344.43,50" fill="#ffffff" stroke="#3ea9f5" stroke-width="1.69" stroke-linejoin="round"/><g class="d-icon-group"><g class="d-icon" data-mark="logo-blue" transform="translate(354 42) scale(0.1333)"><defs/><g id="ic-secrets-mgmt-overview-logo-blue-386-74-logo-large" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><path d="M147.109839,298.504854 L120.218166,298.504854 L120.218166,290.060213 C117.649233,293.285044 115.05301,295.635309 112.429419,297.111079 C107.838135,299.680011 102.618361,300.964459 96.7699392,300.964459 C87.3140802,300.964459 78.8968522,297.712348 71.5180026,291.208029 C62.7180414,283.446572 58.3181267,273.170995 58.3181267,260.380989 C58.3181267,247.372351 62.827356,236.987459 71.8459499,229.226003 C79.0061668,223.049632 87.2320942,219.961493 96.5239788,219.961493 C101.935135,219.961493 107.018266,221.109297 111.773525,223.404939 C114.506432,224.716735 117.321284,226.875699 120.218166,229.881897 L120.218166,175.36067 L147.109839,175.36067 L147.109839,298.504854 Z M121.038034,260.462976 C121.038034,255.653059 119.343657,251.567424 115.954852,248.205948 C112.566047,244.844472 108.466748,243.16376 103.656831,243.16376 C98.3003328,243.16376 93.9004182