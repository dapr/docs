<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.18 -6.9 1407 270" role="img" aria-labelledby="mcp-service-invocation-title mcp-service-invocation-desc"><title id="mcp-service-invocation-title">How an MCP call travels through Dapr service invocation</title><desc id="mcp-service-invocation-desc">On the left, an app hexagon named Agent / MCP client. Its call enters a lane named Dapr, which holds, in order, a pill for the mcp-client App ID, a gold gate for the access policy, a gold gate for the bearer middleware, and a pill for the mcp-server App ID. An allow from the policy reaches the bearer gate; a valid JWT reaches the target App ID, which forwards to the app hexagon named MCP server on the right. Either gate can refuse instead: a deny from the policy and a 401 from the bearer middleware each return along a red dashed run beneath the flow to the lower edge of the caller’s App ID pill.</desc><g class="d-region"><rect class="d-panel" x="263.32" y="26" width="880" height="165.2" rx="10" fill="none" stroke="#747474" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="283.32" y="13" width="64" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/><text x="315.32" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Dapr</text></g></g><g class="d-arrow"><line x1="143.32" y1="133.2" x2="287.32" y2="133.2" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="280.29,137.04 287.32,133.2 280.29,129.36" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="450.32" y1="133.2" x2="541.32" y2="133.2" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="534.29,137.04 541.32,133.2 534.29,129.36" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="599.32" y="87.4" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Access policy</text><text x="599.32" y="87.4" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Access policy</text></g><g class="d-arrow"><line x1="655.32" y1="133.2" x2="749.32" y2="133.2" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="742.29,137.04 749.32,133.2 742.29,129.36" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="703.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">allow</text><text x="703.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="#747474">allow</text></g><g><text x="807.32" y="87.4" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Bearer middleware</text><text x="807.32" y="87.4" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Bearer middleware</text></g><g class="d-arrow"><line x1="863.32" y1="133.2" x2="957.32" y2="133.2" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="950.29,137.04 957.32,133.2 950.29,129.36" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="911.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">valid JWT</text><text x="911.32" y="126.75" text-anchor="middle" font-size="13" font-weight="500" fill="#747474">valid JWT</text></g><g class="d-arrow"><line x1="1120.32" y1="133.2" x2="1261.32" y2="133.2" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="1254.29,137.04 1261.32,133.2 1254.29,129.36" stroke="#0D2192" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M807.32,165.2 L807.32,231.2 Q807.32,243.2 795.32,243.2 L380.32,243.2 Q368.32,243.2 368.32,231.2 L368.32,152.2" fill="none" stroke="#EE0000" stroke-width="2.66" stroke-linecap="round" stroke-dasharray="6 5"/><g class="d-arrow"><line x1="368.32" y1="178.2" x2="368.32" y2="152.2" stroke="#EE0000" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="372.15,159.22 368.32,152.2 364.48,159.22" stroke="#EE0000" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="817.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">401</text><text x="817.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="#747474">401</text></g><g class="d-elbow-arrow"><path class="d-run" d="M599.32,165.2 L599.32,243.2" fill="none" stroke="#EE0000" stroke-width="2.66" stroke-linecap="round" stroke-dasharray="6 5"/></g><g><text x="609.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">deny</text><text x="609.32" y="221.75" text-anchor="start" font-size="13" font-weight="500" fill="#747474">deny</text></g><g class="d-hex d-hex-solid"><polygon points="86.16,67.2 143.32,100.2 143.32,166.2 86.16,199.2 29,166.2 29,100.2" fill="#0bdda3" stroke="#11161f" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/><text x="86.16" y="129.45" text-anchor="middle" font-size="15" font-weight="600" fill="#11161f"><tspan x="86.16">Agent /</tspan><tspan x="86.16" dy="18">MCP client</tspan></text></g><g class="d-pill"><rect x="289.32" y="116.2" width="158" height="34" rx="17" fill="#ffffff" stroke="#0D2192" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/><text x="368.32" y="137.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">mcp-client App ID</text></g><g class="d-decision"><polygon points="599.32,101.2 655.32,133.2 599.32,165.2 543.32,133.2" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-decision"><polygon points="807.32,101.2 863.32,133.2 807.32,165.2 751.32,133.2" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-pill"><rect x="959.32" y="116.2" width="158" height="34" rx="17" fill="#ffffff" stroke="#0D2192" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/><text x="1038.32" y="137.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">mcp-server App ID</text></g><g class="d-hex d-hex-solid"><polygon points="1320.47,67.2 1377.63,100.2 1377.63,166.2 1320.47,199.2 1263.32,166.2 1263.32,100.2" fill="#3ea9f5" stroke="#11161f" stroke-width="2.66" stroke-linejoin="round" stroke-linecap="round"/><text x="1320.47" y="138.45" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">MCP server</text></g></svg>
