<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 1180 259" role="img" aria-labelledby="agents-prompt-chaining-title agents-prompt-chaining-desc"><title id="agents-prompt-chaining-title">The prompt chaining pattern</title><desc id="agents-prompt-chaining-desc">A green circle named In leads to a teal box named LLM 1 carrying a brain mark. Its Output 1 reaches a gold diamond named Gate. On a pass the chain carries on to LLM 2, whose Output 2 reaches LLM 3, whose Output 3 reaches an orange circle named Out. On a fail the run drops out of the row to an orange circle named Exit below the gate.</desc><g class="d-arrow"><line x1="89" y1="63" x2="157" y2="63" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,66.84 157,63 149.98,59.16" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="335" y1="63" x2="403" y2="63" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="395.98,66.84 403,63 395.98,59.16" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="370" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Output 1</text><text x="370" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Output 1</text></g><g class="d-arrow"><line x1="529" y1="63" x2="597" y2="63" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="589.98,66.84 597,63 589.98,59.16" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="564" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Pass</text><text x="564" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Pass</text></g><g class="d-arrow"><line x1="775" y1="63" x2="843" y2="63" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="835.98,66.84 843,63 835.98,59.16" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="810" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Output 2</text><text x="810" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Output 2</text></g><g class="d-arrow"><line x1="1021" y1="63" x2="1089" y2="63" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="1081.98,66.84 1089,63 1081.98,59.16" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="1056" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Output 3</text><text x="1056" y="56.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Output 3</text></g><g class="d-elbow-arrow"><path class="d-run" d="M467,100 L467,168" fill="none" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round"/><g class="d-arrow"><line x1="467" y1="142" x2="467" y2="168" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="463.16,160.98 467,168 470.84,160.98" stroke="#0D2192" stroke-width="2.23" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="477" y="150.2" text-anchor="start" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Fail</text><text x="477" y=