<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.49 0 905.03 385" role="img" aria-labelledby="workflow-async-http-title workflow-async-http-desc"><title id="workflow-async-http-title">The async HTTP API workflow pattern</title><desc id="workflow-async-http-desc">A client posts an order to a start API, which queues the work and returns 202 Accepted with a location to poll. A worker takes the job and updates a job database. The client polls a status API, which reads that database.</desc><g class="d-arrow"><line x1="141.03" y1="84" x2="271" y2="84" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="263.98,87.84 271,84 263.98,80.16" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="206.02" y="74.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">POST /orders</text><g class="d-arrow"><line x1="271" y1="108" x2="141.03" y2="108" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="148.05,104.16 141.03,108 148.05,111.84" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="206.02" y="138.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">202 Accepted</text><g class="d-arrow"><line x1="421" y1="96" x2="532" y2="96" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="524.98,99.84 532,96 524.98,92.16" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="476.5" y="86.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">New order</text><g class="d-elbow-arrow"><path class="d-run" d="M640,96 L804,96 Q816,96 816,108 L816,144" fill="none" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round"/><g class="d-arrow"><line x1="816" y1="120" x2="816" y2="144" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="812.16,136.98 816,144 819.84,136.98" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="728" y="86.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Start processing</text><g class="d-elbow-arrow"><path class="d-run" d="M816,248 L816,284 Q816,296 804,296 L640,296" fill="none" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round"/><g class="d-arrow"><line x1="666" y1="296" x2="640" y2="296" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="647.02,292.16 640,296 647.02,299.84" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="728" y="286.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Update status</text><g class="d-elbow-arrow"><path class="d-run" d="M96,148 L96,284 Q96,296 108,296 L271,296" fill="none" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round"/><g class="d-arrow"><line x1="245" y1="296" x2="271" y2="296" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="263.98,299.84 271,296 263.98,292.16" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="203.5" y="286.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">GET /orders/{id}</text><g class="d-arrow"><line x1="421" y1="296" x2="532" y2="296" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="524.98,299.84 532,296 524.98,292.16" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="476.5" y="286.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">GET status</text><g><g class="d-box"><rect x="271" y="73" width="150" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round"/><text x="346" y="100.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Start API</text></g><g class="d-box"><rect x="271" y="273" width="150" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round"/><text x="346" y="300.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Status API</text></g></g><g class="d-cylinder"><path d="M532,63.42 L532,128.58 A54,12.42 0 0 0 640,128.58 L640,63.42 A54,12.42 0 0 0 532,63.42 Z" fill="#efca08" stroke="none"/><path d="M532,128.58 A54,12.42 0 0 1 640,128.58" fill="none" stroke="#11161f" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3" stroke-opacity="0.35"/><path d="M532,63.42 L532,128.58 A54,12.42 0 0 0 640,128.58 L640,63.42" fill="none" stroke="#11161f" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="586" cy="63.42" rx="54" ry="12.42" fill="#efca08" stroke="#11161f" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="586" y="92.5" text-anchor="middle" font-size="14" font-weight="600" fill="#11161f"><tspan x="586">Job</tspan><tspan x="586" dy="16.8">queue</tspan></text></g></g><g class="d-cylinder"><path d="M532,263.42 L532,328.58 A54,12.42 0 0 0 640,328.58 L640,263.42 A54,12.42 0 0 0 532,263.42 Z" fill="#efca08" stroke="none"/><path d="M532,328.58 A54,12.42 0 0 1 640,328.58" fill="none" stroke="#11161f" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3" stroke-opacity="0.35"/><path d="M532,263.42 L532,328.58 A54,12.42 0 0 0 640,328.58 L640,263.42" fill="none" stroke="#11161f" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="586" cy="263.42" rx