="round" stroke-linejoin="round" fill="none"/></g><g class="d-box"><rect x="293.67" y="77" width="268" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><text x="427.67" y="96.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="427.67">call child workflow (Workflow2)</tspan><tspan x="427.67" dy="15.6">on App2</tspan></text></g><g class="d-box"><rect x="362.67" y="321" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><text x="448.67" y="348.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Activity A</text></g><g><g class="d-node"><circle cx="209.67" cy="100" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="209.67" y="104.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-node"><circle cx="687.67" cy="100" r="30" fill="#ff4e00" stroke="#11161f" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="687.67" y="104.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">End</text></g></g><g class="d-node"><circle cx="209.67" cy="344" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="209.67" y="348.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-node"><circle cx="687.67" cy="344" r="30" fill="#ff4e00" stroke="#11161f" stroke-width="1.48" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="687.67" y="348.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">End</text></g></g></g><g><g class="d-hex d-hex-solid"><polygon points="79.84,54 119.67,77 119