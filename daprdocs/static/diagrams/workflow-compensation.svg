ment</text></g><g class="d-box"><rect x="170" y="237" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="256" y="264.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Ship Order</text></g></g><g><g class="d-arrow"><line x1="256" y1="135" x2="256" y2="163" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="252.16,155.98 256,163 259.84,155.98" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="256" y1="209" x2="256" y2="237" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="252.16,229.98 256,237 259.84,229.98" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><g class="d-box"><rect x="582" y="89" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="668" y="116.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Cancel Shipment</text></g><g class="d-box"><rect x="582" y="163" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="668" y="190.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Refund Payment</text></g><g class="d-box"><rect x="582" y="237" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="668" y="264.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Release Inventory</text></g></g><g><g class="d-arrow"><line x1="668" y1="135" x2="668" y2="163" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="664.16,155.98 668,163 671.84,155.98" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="668" y1="209" x2="668" y2="237" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="664.16,229.98 668,237 671.84,229.98" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-decision"><polygon points="462,154 510,186 462,218 414,186" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/></g><text x="462" y="140.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2330">IsException</text><text x="533" y="176.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Yes</text><text x="476" y="248.2" text-anchor="start" font-size="12" font-weight="500" fill="#747474">No</text><g class="d-node"><circle cx="70" cy="186" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="70" y="190.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-node"><circle cx="552" cy="370" r="30" fill="#ff4e00" stroke="#11161f" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="552" y="374.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">End</text></g></g></svg>
