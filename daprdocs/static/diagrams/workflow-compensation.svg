<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 820 434" role="img" aria-labelledby="workflow-compensation-title workflow-compensation-desc"><title id="workflow-compensation-title">The compensation workflow pattern</title><desc id="workflow-compensation-desc">A workflow reserves inventory, processes payment and ships an order. If any step raises an exception, the compensating activities run in reverse order: cancel the shipment, refund the payment, release the inventory reservation.</desc><g class="d-region"><rect class="d-panel" x="144" y="63" width="224" height="246" rx="10" fill="none" stroke="#747474" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="164" y="50" width="62" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="67.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">try</text></g></g><g class="d-region"><rect class="d-panel" x="556" y="63" width="224" height="246" rx="10" fill="none" stroke="#747474" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="576" y="50" width="62" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><text x="607" y="67.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">catch</text></g></g><g class="d-arrow"><line x1="100" y1="186" x2="144" y2="186" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="136.98,189.84 144,186 136.98,182.16" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="368" y1="186" x2="414" y2="186" stroke="#0D2192" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="406.98,189.84 414,186 406.9