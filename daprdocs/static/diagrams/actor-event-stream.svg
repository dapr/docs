<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7.5 1090 669" role="img" aria-labelledby="actor-event-stream-title actor-event-stream-desc"><title id="actor-event-stream-title">The app-initiated actor event stream, message by message</title><desc id="actor-event-stream-desc">Two columns: an app on the left and daprd, the Dapr sidecar, on the right. In the first band the app opens the stream with SubscribeActorEventsAlpha1, sends an initial request registering the actor types it hosts, and daprd acknowledges. In the second band daprd calls back three times - an invoke request, a reminder request and a deactivate request - and the app answers each one, every pair carrying the same id.</desc><g class="d-region"><rect class="d-panel" x="178" y="55" width="734" height="223.5" rx="10" fill="none" stroke="#747474" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="414" y="44" width="262" height="22" rx="11" fill="#ffffff" stroke="#747474" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="545" y="59.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Step 1: open the stream and register</text></g></g><g class="d-region"><rect class="d-panel" x="178" y="326.5" width="734" height="313.5" rx="10" fill="none" stroke="#747474" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="455" y="315.5" width="180" height="22" rx="11" fill="#ffffff" stroke="#747474" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="545" y="331.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Step 2: handle callbacks</text></g></g><g class="d-arrow"><line x1="163" y1="135.5" x2="927" y2="135.5" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="919.98,139.34 927,135.5 919.98,131.66" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="113.8" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">SubscribeActorEventsAlpha1()</text><text x="545" y="130.05" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">open stream</text><g class="d-arrow"><line x1="163" y1="198" x2="927" y2="198" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="919.98,201.84 927,198 919.98,194.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="176.3" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">SubscribeActorEventsRequestInitialAlpha1</text><text x="545" y="192.55" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">(register actor types + config)</text><g class="d-arrow"><line x1="927" y1="260.5" x2="163" y2="260.5" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="170.02,256.66 163,260.5 170.02,264.34" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="238.8" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">SubscribeActorEventsResponseInitialAlpha1</text><text x="545" y="255.05" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">(ack - empty = success)</text><g class="d-arrow"><line x1="927" y1="390.75" x2="163" y2="390.75" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="170.02,386.91 163,390.75 170.02,394.59" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="385.3" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">invoke_request (id="abc", method="x")</text><g class="d-arrow"><line x1="163" y1="437" x2="927" y2="437" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="919.98,440.84 927,437 919.98,433.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="431.55" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">invoke_response (id="abc", data=...)</text><g class="d-arrow"><line x1="927" y1="483.25" x2="163" y2="483.25" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="170.02,479.41 163,483.25 170.02,487.09" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="477.8" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">reminder_request (id="def")</text><g class="d-arrow"><line x1="163" y1="529.5" x2="927" y2="529.5" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="919.98,533.34 927,529.5 919.98,525.66" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="524.05" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">reminder_response (id="def")</text><g class="d-arrow"><line x1="927" y1="575.75" x2="163" y2="575.75" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="170.02,571.91 163,575.75 170.02,579.59" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="570.3" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">deactivate_request (id="ghi")</text><g class="d-arrow"><line x1="163" y1="622" x2="927" y2="622" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="919.98,625.84 927,622 919.98,618.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="545" y="616.55" text-anchor="middle" font-size="13" font-weight="600" font-family="var(--font-mono)" style="font-variant-ligatures: none" fill="#1c2330">deactivate_response (id="ghi")</text><g class="d-box"><rect x="29" y="55" width="132" height="585" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="95" y="352.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">App</text></g><g class="d-box"><rect x="929" y="55" width="132" height="585" rx="6" fill="#D8ECFD" fill-opacity="0.6" stroke="#3ea9f5" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="995" y="344.25" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="995">daprd</tspan><tspan x="995" dy="15.6">(Dapr sidecar)</tspan></text></g></svg>
