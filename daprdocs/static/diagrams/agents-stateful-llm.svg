<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 648 389" role="img" aria-labelledby="agents-stateful-llm-title agents-stateful-llm-desc"><title id="agents-stateful-llm-title">The durable agent pattern</title><desc id="agents-stateful-llm-desc">A green circle named In leads into a dashed band captioned Durable agent. Inside it a teal box named Workflow, carrying a flowchart mark, and a teal box named LLM, carrying a brain mark, pass work round a loop to each other. The band leads on to an orange circle named Out. Beneath the band, three blue boxes stand in a row: Retrieval on the left, Tools in the middle and Memory on the right, and a run with an arrowhead at each end joins the band to each of them: Query and Results to Retrieval, Call and Response to Tools, Read and Write to Memory.</desc><g class="d-region"><rect class="d-panel" x="182" y="26" width="284" height="186" rx="10" fill="none" stroke="#747474" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="202" y="13" width="112" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="258" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Durable agent</text></g></g><g class="d-arrow"><line x1="112" y1="119" x2="180" y2="119" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="172.98,122.84 180,119 172.98,115.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="466" y1="119" x2="534" y2="119" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="526.98,122.84 534,119 526.98,115.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M412,78 L430,78 Q442,