<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.15 0 904 518" role="img" aria-labelledby="workflow-overview-title workflow-overview-desc"><title id="workflow-overview-title">A workflow app holding its workflow and activity definitions, and the Dapr Workflow engine that runs them</title><desc id="workflow-overview-desc">On the left, a blue hexagon named Workflow App, captioned Workflow and Activity definitions. A dashed line runs from it to a dashed region in the middle holding a flowchart: a green Start circle down to Activity 1, down to a gold gate, which goes one way down to Activity 3 and the other way across to Activity 2; both branches meet at an orange End circle. From the region, a line with a head at each end runs to a hexagon carrying the Dapr logo on the right, named Dapr Workflow engine; the line is labelled Dapr API above and HTTP/gRPC below.</desc><g class="d-arrow"><line x1="173.03" y1="259" x2="223" y2="259" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 5"/></g><g class="d-region"><rect class="d-panel" x="225" y="14" width="362" height="490" rx="10" fill="none" stroke="#747474" stroke-width="1.71" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/></g><g class="d-arrow"><line x1="317" y1="100" x2="317" y2="122" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="313.16,114.98 317,122 320.84,114.98" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="317" y1="170" x2="317" y2="192" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="313.16,184.98 317,192 320.84,184.98" stroke="#0D2192" stroke-width="1.71" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M317,254 L317,346" fill="none" stroke="#0D219