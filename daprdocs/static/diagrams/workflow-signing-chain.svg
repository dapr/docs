<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.5 1104 460" role="img" aria-labelledby="workflow-signing-chain-title workflow-signing-chain-desc"><title id="workflow-signing-chain-title">How workflow history events, their signature chain and the signing certificates relate</title><desc id="workflow-signing-chain-desc">Three dashed bands, stacked. The top band, Workflow History, holds six boxes in a row, Event 0 to Event 5, joined by a plain line because they sit in order rather than flowing into one another. The middle band, Signature Chain, holds three boxes: Sig 0 covering events 0 to 2, Sig 1 covering events 2 to 4, and Sig 2 covering events 4 to 6, each joined to the next by an arrow carrying the words prev digest. A dotted line runs down from each pair of events to the signature that covers it. The bottom band, Certificate Table, holds Cert 0, the SVID from boot 1, and Cert 1, the SVID from boot 2; dotted lines run down from Sig 0 and Sig 1 to Cert 0, both marked cert index 0, and from Sig 2 to Cert 1, marked cert index 1.</desc><g class="d-region"><rect class="d-panel" x="29" y="26" width="1046" height="96" rx="10" fill="none" stroke="#747474" stroke-width="2.09" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="13" width="152" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.09" stroke-linejoin="round" stroke-linecap="round"/><text x="125" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Workflow History</text></g></g><g class="d-region"><rect class="d-panel" x="29" y="172" width="1046" height="108" rx="10" fill="none" stroke="#747474" stroke-width="2.09" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="159" width="148" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.09" stroke-linejoin="round" str