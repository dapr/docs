<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="4.5 5.69 875 487" role="img" aria-labelledby="agents-tool-call-flow-title agents-tool-call-flow-desc"><title id="agents-tool-call-flow-title">What travels during a tool call</title><desc id="agents-tool-call-flow-desc">Four messages pass between the app on the left and the model on the right, each drawn as a payload in the middle. First the user sends a chat completion payload carrying the question and the available tools. The model, marked as step two, chooses a tool, and returns an assistant message holding a tool call with an id, a name and arguments. The AI agent runs the tool and sends back a tool message carrying the same id and the result. The model then returns a final assistant message, which reaches the user.</desc><g class="d-code-card"><text x="440" y="51.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">Chat completion payload</text><rect x="210" y="63" width="460" height="58" rx="10" fill="#ffffff" stroke="#747474" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/><text x="224" y="89" text-anchor="start" font-size="12" font-weight="400" font-family="&quot;Geist Mono&quot;, ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace" style="font-variant-ligatures: none" fill="#1c2330"><tspan x="224">user: What is the weather in Virginia?</tspan><tspan x="224" dy="14.4">tools: jump, get_weather</tspan></text></g><g class="d-code-card"><text x="440" y="147.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">Assistant message</text><rect x="210" y="159" width="460" height="86" rx="10" fill="#ffffff" stroke="#747474" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/><text x="224" y="184.6" text-anchor="start" font-size="12" font-weight="400" font-family="&quot;Geist Mono&quot;, ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace" style="font-variant-ligatures: none" fill="#1c2330"><tspan x="224">tool_calls:</tspan><tspan x="224" dy="14.4">  id: call_12345</tspan><tspan x="224" dy="14.4">  name: get_weather</tspan><tspan x="224" dy="14.4">  args: {"location": "virginia"}</tspan></text></g><g class="d-code-card"><text x="440" y="270.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">Tool message</text><rect x="210" y="282" width="460" height="72" rx="10" fill="#ffffff" stroke="#747474" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/><text x="224" y="307.8" text-anchor="start" font-size="12" font-weight="400" font-family="&quot;Geist Mono&quot;, ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace" style="font-variant-ligatures: none" fill="#1c2330"><tspan x="224">tool_call_id: call_12345</tspan><tspan x="224" dy="14.4">name: get_weather</tspan><tspan x="224" dy="14.4">content: {"virginia": "80F"}</tspan></text></g><g class="d-code-card"><text x="440" y="380.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">Assistant message</text><rect x="210" y="392" width="460" height="44" rx="10" fill="#ffffff" stroke="#747474" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/><text x="224" y="418.2" text-anchor="start" font-size="12" font-weight="400" font-family="&quot;Geist Mono&quot;, ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace" style="font-variant-ligatures: none" fill="#1c2330">The weather in virginia is 80 F.</text></g><g class="d-arrow"><line x1="110" y1="92" x2="208" y2="92" stroke="#0D2192" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="200.98,95.84 208,92 200.98,88.16" stroke="#0D2192" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="670" y1="92" x2="752" y2="92" stroke="#0D2192" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="744.98,95.84 