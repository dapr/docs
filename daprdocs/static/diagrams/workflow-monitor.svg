<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.22 1089 281" role="img" aria-labelledby="workflow-monitor-title workflow-monitor-desc"><title id="workflow-monitor-title">The monitor workflow pattern</title><desc id="workflow-monitor-desc">A workflow checks a status, sends a notification, creates a timer to wait, and then restarts itself from the beginning with continue-as-new.</desc><g class="d-elbow-arrow"><path class="d-run" d="M1020,129 L1037,129 Q1049,129 1049,141 L1049,229 Q1049,241 1037,241 L82,241 Q70,241 70,229 L70,159" fill="none" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round"/><g class="d-arrow"><line x1="70" y1="185" x2="70" y2="159" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="73.84,166.02 70,159 66.16,166.02" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><g class="d-arrow"><line x1="100" y1="129" x2="158" y2="129" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="150.98,132.84 158,129 150.98,125.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="330" y1="129" x2="388" y2="129" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="380.98,132.84 388,129 380.98,125.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="560" y1="129" x2="618" y2="129" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="610.98,132.84 618,129 610.98,125.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="790" y1="129" x2="848" y2="129" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="840.98,132.84 848,129 840.98,125.16" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><g class="d-arrow"><line x1="244" y1="106" x2="244" y2="71.55" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="247.84,78.57 244,71.55 240.16,78.57" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-arrow-step-in-right" transform="translate(218.8 26.7727) scale(2.1)" fill="#3ea9f5" color="#3ea9f5"><path fill="currentColor" d="M8.706 16.234a.75.75 0 1 0 1.088 1.032l4.5-4.75a.75.75 0 0 0 0-1.032l-4.5-4.75a.75.75 0 0 0-1.088 1.032l3.3 3.484H2.75a.75.75 0 0 0 0 1.5h9.256zM22 12a3 3 0 1 0-6 0a3 3 0 0 0 6 0m-1.5 0a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0"/></g></g><g class="d-arrow"><line x1="474" y1="106" x2="474" y2="71.55" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="477.84,78.57 474,71.55 470.16,78.57" stroke="#0D2192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-icon-group"><g class="d-icon" data-mark="fluent-arrow-step-in-right" transform="translate(448.8 26.7727) scale(2.1)" fill="#3ea9f5" color="#3ea9f5"><path fill="currentColor" d="M8.706 16.234a.75.75 0 1 0 1.088 1.032l4.5-4.75a.75.75 0 0 0 0-1.032l-4.5-4.75a.75.75 0 0 0-1.088 1.032l3.3 3.484H2.75a.75.75 0 0 0 0 1.5h9.256zM22 12a3 3 0 1 0-6 0a3 3 0 0 0 6 0m-1.5 0a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0"/></g></g></g><g><g class="d-box"><rect x="158" y="106" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="244" y="133.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">CheckStatus</text></g><g class="d-box"><rect x="388" y="106" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="474" y="133.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">SendNotification</text></g><g class="d-box"><rect x="618" y="106" width="172" height="46" rx="6" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="704" y="133.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">CreateTimer</text></g><g class="d-box"><rect x="848" y="106" width="172" height="46" rx="6" fill="#efca08" fill-opacity="0.6" stroke="#11161f" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="934" y="133.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">ContinueAsNew</text></g></g><g><text x="704" y="175" text-anchor="middle" font-size="12" font-weight="500" fill="#747474"><tspan x="704">Wait to proceed with workflow</tspan><tspan x="704" dy="14.4">until the timer expires</tspan></text><text x="934" y="175" text-anchor="middle" font-size="12" font-weight="500" fill="#747474"><tspan x="934">Restart the workflow</tspan><tspan x="934" dy="14.4">without the history</tspan></text></g><g class="d-node"><circle cx="70" cy="129" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="2.06" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="133.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></svg>
