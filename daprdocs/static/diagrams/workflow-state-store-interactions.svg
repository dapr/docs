<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="-0.3 -0.17 1030 428" role="img" aria-labelledby="workflow-state-store-interactions-title workflow-state-store-interactions-desc"><title id="workflow-state-store-interactions-title">What a workflow actor reads from and writes to the state store on one turn</title><desc id="workflow-state-store-interactions-desc">On the left, a gold cylinder named State store, with a dashed leader down to the history log it holds: seven rows, one per state store key - started, call activity1, activity1 done, call activity2, call activity3, and then activity2 done and activity3 done, the two this turn added, outlined in teal. In the middle a circle named Workflow Actor, and on the right an app hexagon named Workflow code. Three steps: load the existing history, which is cached; execute the next step in the workflow code and get its result; and append the new history to the log.</desc><path class="d-run" d="M129,180.67 L129,224.67" fill="none" stroke="#747474" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="6 5"/><g class="d-arrow"><line x1="229" y1="97.33" x2="517" y2="97.33" stroke="#0D2192" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="509.98,101.17 517,97.33 509.98,93.5" stroke="#0D2192" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="374" y="75.28" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="374">1. Load existing history</tspan><tspan x="374" dy="15.6">(cached)</tspan></text><text x="374" y="75.28" text-anchor="middle" font-size="13" font-weight="500" fill="#747474"><tspan x="374">1. Load existing history</tspan><tspan x="374" dy="15.6">(cached)</tspan></text></g><g class="d-arrow"><line x1="643" y1="97.33" x2="891" y2="97.33" stroke=