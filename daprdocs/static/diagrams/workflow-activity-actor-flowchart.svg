<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 88" role="img" aria-labelledby="workflow-activity-actor-flowchart-title workflow-activity-actor-flowchart-desc"><title id="workflow-activity-actor-flowchart-title">The lifecycle of a Dapr workflow activity actor</title><desc id="workflow-activity-actor-flowchart-desc">A strip, left to right: a green Start terminal, then Invocation message received, then Execute activity code, then Send result to workflow actor, then an orange End terminal. Activity actors are short-lived - they are activated for one task, call the activity code, send the result to the parent workflow actor, and deactivate themselves.</desc><g class="d-arrow"><line x1="89" y1="44" x2="145" y2="44" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="137.98,47.84 145,44 137.98,40.16" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="319" y1="44" x2="375" y2="44" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="367.98,47.84 375,44 367.98,40.16" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="549" y1="44" x2="605" y2="44" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="597.98,47.84 605,44 597.98,40.16" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="779" y1="44" x2="835" y2="44" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="827.98,47.84 835,44 827.98,40.16" stroke="#0D2192" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-node"><circle cx="59" cy="44" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="59" y="48.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-box"><rect x="147" y="15" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><text x="233" y="40.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="233">Invocation message</tspan><tspan x="233" dy="15.6">received</tspan></text></g><g class="d-box"><rect x="377" y="15" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><text x="463" y="48.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Execute activity code</text></g><g class="d-box"><rect x="607" y="15" width="172" height="58" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><text x="693" y="40.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="693">Send result to</tspan><tspan x="693" dy="15.6">workflow actor</tspan></text></g><g class="d-node"><circle cx="867" cy="44" r="30" fill="#ff4e00" stroke="#11161f" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="867" y="48.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">End</text></g></g></svg>
