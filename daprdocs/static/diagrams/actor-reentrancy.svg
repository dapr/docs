<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2.66 939 443" role="img" aria-labelledby="actor-reentrancy-title actor-reentrancy-desc"><title id="actor-reentrancy-title">The two call chains actor reentrancy allows</title><desc id="actor-reentrancy-desc">On the left, a green hexagon named Coordinator Actor at the top, with a blue hexagon named Worker Actor 1 below left and a gold hexagon named Worker Actor 2 below right. Each worker is joined to the coordinator by two arrows: start work running down to the worker, and work complete running back up into the coordinator. Under them, the chain ActorA -&gt; Actor B -&gt; Actor A. On the right, a teal hexagon named Actor with an arrow leaving its right side, turning down and returning into it, labelled Call local method; under it, the chain Actor A -&gt; Actor A.</desc><g><g class="d-arrow"><line x1="234.21" y1="123.45" x2="122.23" y2="251.43" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="123.96,243.62 122.23,251.43 129.74,248.67" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="141.79" y1="268.55" x2="253.77" y2="140.57" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="252.04,148.38 253.77,140.57 246.26,143.33" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="155.64" y="172.23" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">start work</text><text x="155.64" y="172.23" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">start work</text></g><g><text x="220.36" y="221.07" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="220.36">work</tspan><tspan x="220.36" dy="15.6">complete</tspan></text><text x="220.36" y="221.07" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="220.36">work</tspan><tspan x="220.36" dy="15.6">complete</tspan></text></g></g><g><g class="d-arrow"><line x1="337.79" y1="123.45" x2="449.77" y2="251.43" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="442.26,248.67 449.77,251.43 448.04,243.62" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="430.21" y1="268.55" x2="318.23" y2="140.57" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="325.74,143.33 318.23,140.57 319.96,148.38" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g><text x="416.36" y="172.23" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">start work</text><text x="416.36" y="172.23" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">start work</text></g><g><text x="351.64" y="221.07" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><tspan x="351.64">work</tspan><tspan x="351.64" dy="15.6">complete</tspan></text><text x="351.64" y="221.07" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="351.64">work</tspan><tspan x="351.64" dy="15.6">complete</tspan></text></g></g><g class="d-elbow-arrow"><path class="d-run" d="M785.62,278 L897.62,278 Q909.62,278 909.62,290 L909.62,326 Q909.62,338 897.62,338 L785.62,338" fill="none" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round"/><g class="d-arrow"><line x1="811.62" y1="338" x2="785.62" y2="338" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="792.64,334.16 785.62,338 792.64,341.84" stroke="#0D2192" stroke-width="1.77" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><text x="846.62" y="304.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="846.62">Call local</tspan><tspan x="846.62" dy="15.6">method</tspan></text><g class="d-hex d-hex-solid"><polygon points="286,14 346.62,49 346.62,119 286,154 225.38,119 225.38,49" fill="#0bdda3" stroke="#11161f" stroke-width="1.77" stroke-linejoin="round" stroke-linecap="round"/><text x="286" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#11161f"><tspan x="286">Coordinator</tspan><tspan x="286" dy="19.2">Actor</tspan></text></g><g class="d-hex d-hex-solid"><polygon points="90,238 150.62,273 150.62,343 90,378 29.38,343 29.38,273" fill="#3ea9f5" stroke="#11161f" stroke-width="1.77" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff"><tspan x="90">Worker</tspan><tspan x="90" dy="19.2">Actor 1</tspan></text></g><g class="d-hex d-hex-solid"><polygon points="482,238 542.62,273 542.62,343 482,378 421.38,343 421.38,273" fill="#efca08" stroke="#11161f" stroke-width="1.77" stroke-linejoin="round" stroke-linecap="round"/><text x="482" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#11161f"><tspan x="482">Worker</tspan><tspan x="482" dy="19.2">Actor 2</tspan></text></g><g class="d-hex d-hex-solid"><polygon points="723,238 783.62,273 783.62,343 723,378 662.38,343 662.38,273" fill="#4ea4af" stroke="#11161f" stroke-width="1.77" stroke-linejoin="round" stroke-linecap="round"/><text x="723" y="313.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Actor</text></g><text x="286" y="420.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1c2330">Actor A → Actor B → Actor A</text><text x="786" y="420.55" text