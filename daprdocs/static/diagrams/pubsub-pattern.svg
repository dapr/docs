<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.11 0 1011 452" role="img" aria-labelledby="pubsub-pattern-title pubsub-pattern-desc"><title id="pubsub-pattern-title">The publish and subscribe pattern: a publisher, a broker, and the subscribers reading from it</title><desc id="pubsub-pattern-desc">On the left, a green hexagon named Publisher. An arrow runs from it to a pill named Input channel, on to a green message broker named Message broker, and on to a second pill named Output channel. From that pill three lines fan out, each turning once, to three blue hexagons all named Subscriber - one role drawn three times, so all three carry the same name and the same colour.</desc><g class="d-arrow"><line x1="138.39" y1="226" x2="190.39" y2="226" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="183.37,229.84 190.39,226 183.37,222.16" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="320.39" y1="226" x2="374.39" y2="226" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="367.37,229.84 374.39,226 367.37,222.16" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="540.39" y1="226" x2="594.39" y2="226" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="587.37,229.84 594.39,226 587.37,222.16" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M726.39,226 L766.39,226 Q778.39,226 778.39,214 L778.39,88 Q778.39,76 790.39,76 L872.39,76" fill="none" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round"/><g class="d-arrow"><line x1="846.39" y1="76" x2="872.39" y2="76" stroke="#0D2192" stroke-width="1.91" stroke-linecap="round" stroke-