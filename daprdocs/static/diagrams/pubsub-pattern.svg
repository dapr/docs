3" stroke-opacity="0.35"/><path d="M388.39,174 L528.39,174 A12,30 0 0 1 528.39,234 L388.39,234" fill="none" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="388.39" cy="204" rx="12" ry="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="458.39" y="200.75" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f"><tspan x="458.39">Message</tspan><tspan x="458.39" dy="15.6">broker</tspan></text></g></g></g><g class="d-pill"><rect x="596.39" y="189" width="128" height="30" rx="15" fill="#ffffff" stroke="#0D2192" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="660.39" y="208.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Output channel</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,14 981.77,45 981.77,107 928.08,138 874.39,107 874.39,45" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="81.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,142 981.77,173 981.77,235 928.08,266 874.39,235 874.39,173" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="209.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,270 981.77,301 981.77,363 928.08,394 874.39,363 874.39,301" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="337.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g></svg>
