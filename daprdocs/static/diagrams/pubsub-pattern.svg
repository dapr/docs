3" stroke-opacity="0.35"/><path d="M388.39,196 L528.39,196 A12,30 0 0 1 528.39,256 L388.39,256" fill="none" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="388.39" cy="226" rx="12" ry="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="458.39" y="222.75" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f"><tspan x="458.39">Message</tspan><tspan x="458.39" dy="15.6">broker</tspan></text></g></g></g><g class="d-pill"><rect x="596.39" y="211" width="128" height="30" rx="15" fill="#ffffff" stroke="#0D2192" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="660.39" y="230.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Output channel</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,14 981.77,45 981.77,107 928.08,138 874.39,107 874.39,45" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="81.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,164 981.77,195 981.77,257 928.08,288 874.39,257 874.39,195" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="231.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g><g class="d-hex d-hex-solid"><polygon points="928.08,314 981.77,345 981.77,407 928.08,438 874.39,407 874.39,345" fill="#3ea9f5" stroke="#11161f" stroke-width="1.91" stroke-linejoin="round" stroke-linecap="round"/><text x="928.08" y="381.6" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Subscriber</text></g></svg>
