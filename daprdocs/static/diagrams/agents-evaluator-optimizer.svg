<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0.59 740 243" role="img" aria-labelledby="agents-evaluator-optimizer-title agents-evaluator-optimizer-desc"><title id="agents-evaluator-optimizer-title">The evaluator-optimizer pattern</title><desc id="agents-evaluator-optimizer-desc">A green circle named In leads to a teal box named LLM Call Generator carrying a brain mark. Its solution goes over the top to a teal box named LLM Call Evaluator, also carrying a brain mark, which leads on to an orange circle named Out. Underneath, a second run carries a rejected answer and the feedback on it back from the evaluator to the generator, so the pair loops until the answer is accepted.</desc><g class="d-arrow"><line x1="89" y1="120" x2="157" y2="120" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,123.84 157,120 149.98,116.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M247,94 L247,60 Q247,48 259,48 L481,48 Q493,48 493,60 L493,92" fill="none" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="493" y1="70" x2="493" y2="92" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="489.16,84.98 493,92 496.84,84.98" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><text x="370" y="41.2" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" aria-hidden="true">Solution</text><text x="370" y="41.2" text-anchor="middle" font-size="12" font-weight="500" fill="#747474">Solution</text></g><g class="d-elbow-arrow"><path class="d-run" d="M493,146 L493,180 Q493,192 481,192 L259,192 Q247,192 247,180 L247,148" fill=