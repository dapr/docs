<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 740 271" role="img" aria-labelledby="agents-parallelization-title agents-parallelization-desc"><title id="agents-parallelization-title">The parallelization pattern</title><desc id="agents-parallelization-desc">A green circle named In fans out to three teal boxes named LLM 1, LLM 2 and LLM 3, each carrying a brain mark, which run at the same time. All three lead to a teal box named Aggregator, which carries no brain mark because it is code rather than a model call, and the aggregator leads to an orange circle named Out.</desc><g class="d-elbow-arrow"><path class="d-run" d="M59,104 L59,64 Q59,52 71,52 L157,52" fill="none" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="131" y1="52" x2="157" y2="52" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,55.84 157,52 149.98,48.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-arrow"><line x1="89" y1="134" x2="157" y2="134" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,137.84 157,134 149.98,130.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M59,164 L59,204 Q59,216 71,216 L157,216" fill="none" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round"/><g class="d-arrow"><line x1="131" y1="216" x2="157" y2="216" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,219.84 157,216 149.98,212.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-elbow-arrow"><path class="d-run" d="M335,52 L481,52 Q493,52 493,6