<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 140" role="img" aria-labelledby="workflow-task-chaining-title workflow-task-chaining-desc"><title id="workflow-task-chaining-title">The task chaining workflow pattern</title><desc id="workflow-task-chaining-desc">A workflow runs three activities one after another. Start leads to Activity 1, which leads to Activity 2, which leads to Activity 3, which leads to End.</desc><g><g class="d-arrow"><line x1="100" y1="70" x2="158" y2="70" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="150.98,73.84 158,70 150.98,66.16" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="330" y1="70" x2="388" y2="70" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="380.98,73.84 388,70 380.98,66.16" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="560" y1="70" x2="618" y2="70" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="610.98,73.84 618,70 610.98,66.16" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="790" y1="70" x2="848" y2="70" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="840.98,73.84 848,70 840.98,66.16" stroke="#0D2192" stroke-width="1.79" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g><g class="d-box"><rect x="158" y="47" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.79" stroke-linejoin="round" stroke-linecap="round"/><text x="244" y="74.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Activity 1</text></g><g class="d-box"><rect x="388" y="47" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.79" stroke-linejoin="round" stroke-linecap="round"/><text x="474" y="74.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Activity 2</text></g><g class="d-box"><rect x="618" y="47" width="172" height="46" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.79" stroke-linejoin="round" stroke-linecap="round"/><text x="704" y="74.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Activity 3</text></g></g><g class="d-node"><circle cx="70" cy="70" r="30" fill="#0bdda3" stroke="#11161f" stroke-width="1.79" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="70" y="74.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">Start</text></g></g><g class="d-node"><circle cx="878" cy="70" r="30" fill="#ff4e00" stroke="#11161f" stroke-width="1.79" stroke-linejoin="round" stroke-linecap="round"/><g class="d-on-fill"><text x="878" y="74.55" text-anchor="middle" font-size="13" font-weight="600" fill="#11161f">End</text></g></g></svg>
