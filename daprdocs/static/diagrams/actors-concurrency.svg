<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.27 10.88 1228 724" role="img" aria-labelledby="actors-concurrency-title actors-concurrency-desc"><title id="actors-concurrency-title">A timeline of six requests against two actors, showing each actor’s lock held by one turn at a time</title><desc id="actors-concurrency-desc">Time runs down the page, marked by an arrow on the left. Six vertical lines stand side by side, headed ActorId1 Method1, ActorId1 Method2, ActorId1 Timer, ActorId2 Method1 for client request xyz789, ActorId2 Method1 for client request abc123, and ActorId2 Reminder. On each line a run of six dots is drawn over a tinted band: Lock acquired, Entered the method or callback, Created Task, the method exited and the task completed, and Lock released. The first column of each actor takes the lock on arrival; the other two show the request arriving early and waiting for the lock asynchronously. The three ActorId1 bands never overlap one another and neither do the three ActorId2 bands, but the two actors’ bands run at the same times - a lock is per actor, not across actors.</desc><g class="d-arrow"><line x1="45" y1="108" x2="45" y2="686" stroke="#0D2192" stroke-width="2.32" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="41.16,678.98 45,686 48.84,678.98" stroke="#0D2192" stroke-width="2.32" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="45" y="90.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Time</text><g class="d-named-mark"><text x="91" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="91">ActorId1</tspan><tspan x="91" dy="15.6">Method1</tspan></text><line x1="91" y1="94" x2="91" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="81" y="94.4" width="20" height="197.20000000000002" rx="4" fill="#4ea4af" opacity="0.45"/><g><circle cx="91" cy="108" r="5" fill="#11161f"/><text x="111" y="104.75" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="111">Request arrived, lock</tspan><tspan x="111" dy="15.6">acquired without wait</tspan></text></g><g><circle cx="91" cy="142" r="5" fill="#11161f"/><text x="111" y="146.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered Method1</text></g><g><circle cx="91" cy="176" r="5" fill="#11161f"/><text x="111" y="180.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="91" cy="210" r="5" fill="#11161f"/><text x="111" y="214.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited Method1</text></g><g><circle cx="91" cy="244" r="5" fill="#11161f"/><text x="111" y="248.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="91" cy="278" r="5" fill="#11161f"/><text x="111" y="282.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g><g class="d-named-mark"><text x="285" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="285">ActorId1</tspan><tspan x="285" dy="15.6">Method2</tspan></text><line x1="285" y1="94" x2="285" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="275" y="298.4" width="20" height="197.20000000000005" rx="4" fill="#4ea4af" opacity="0.45"/><g><circle cx="285" cy="142" r="5" fill="#ffffff" stroke="#1c2330" stroke-width="2.32"/><text x="305" y="130.95" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="305">Request arrived,</tspan><tspan x="305" dy="15.6">waiting for lock</tspan><tspan x="305" dy="15.6">asynchronously</tspan></text></g><g><circle cx="285" cy="312" r="5" fill="#11161f"/><text x="305" y="316.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock acquired</text></g><g><circle cx="285" cy="346" r="5" fill="#11161f"/><text x="305" y="350.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered Method2</text></g><g><circle cx="285" cy="380" r="5" fill="#11161f"/><text x="305" y="384.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="285" cy="414" r="5" fill="#11161f"/><text x="305" y="418.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited Method2</text></g><g><circle cx="285" cy="448" r="5" fill="#11161f"/><text x="305" y="452.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="285" cy="482" r="5" fill="#11161f"/><text x="305" y="486.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g><g class="d-named-mark"><text x="479" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="479">ActorId1</tspan><tspan x="479" dy="15.6">Timer</tspan></text><line x1="479" y1="94" x2="479" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="469" y="502.4" width="20" height="197.20000000000005" rx="4" fill="#4ea4af" opacity="0.45"/><g><circle cx="479" cy="210" r="5" fill="#ffffff" stroke="#1c2330" stroke-width="2.32"/><text x="499" y="198.95" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="499">Request arrived,</tspan><tspan x="499" dy="15.6">waiting for lock</tspan><tspan x="499" dy="15.6">asynchronously</tspan></text></g><g><circle cx="479" cy="516" r="5" fill="#11161f"/><text x="499" y="520.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock acquired</text></g><g><circle cx="479" cy="550" r="5" fill="#11161f"/><text x="499" y="554.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered callback</text></g><g><circle cx="479" cy="584" r="5" fill="#11161f"/><text x="499" y="588.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="479" cy="618" r="5" fill="#11161f"/><text x="499" y="622.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="479" cy="652" r="5" fill="#11161f"/><text x="499" y="656.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited callback</text></g><g><circle cx="479" cy="686" r="5" fill="#11161f"/><text x="499" y="690.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g><g class="d-named-mark"><text x="673" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="673">ActorId2</tspan><tspan x="673" dy="15.6">Method1</tspan><tspan x="673" dy="15.6">(client request ‘xyz789’)</tspan></text><line x1="673" y1="94" x2="673" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="663" y="94.4" width="20" height="197.20000000000002" rx="4" fill="#efca08" opacity="0.45"/><g><circle cx="673" cy="108" r="5" fill="#11161f"/><text x="693" y="104.75" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="693">Request arrived, lock</tspan><tspan x="693" dy="15.6">acquired without wait</tspan></text></g><g><circle cx="673" cy="142" r="5" fill="#11161f"/><text x="693" y="146.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered Method1</text></g><g><circle cx="673" cy="176" r="5" fill="#11161f"/><text x="693" y="180.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="673" cy="210" r="5" fill="#11161f"/><text x="693" y="214.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited Method1</text></g><g><circle cx="673" cy="244" r="5" fill="#11161f"/><text x="693" y="248.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="673" cy="278" r="5" fill="#11161f"/><text x="693" y="282.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g><g class="d-named-mark"><text x="867" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="867">ActorId2</tspan><tspan x="867" dy="15.6">Method1</tspan><tspan x="867" dy="15.6">(client request ‘abc123’)</tspan></text><line x1="867" y1="94" x2="867" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="857" y="298.4" width="20" height="197.20000000000005" rx="4" fill="#efca08" opacity="0.45"/><g><circle cx="867" cy="142" r="5" fill="#ffffff" stroke="#1c2330" stroke-width="2.32"/><text x="887" y="130.95" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="887">Request arrived,</tspan><tspan x="887" dy="15.6">waiting for lock</tspan><tspan x="887" dy="15.6">asynchronously</tspan></text></g><g><circle cx="867" cy="312" r="5" fill="#11161f"/><text x="887" y="316.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock acquired</text></g><g><circle cx="867" cy="346" r="5" fill="#11161f"/><text x="887" y="350.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered Method1</text></g><g><circle cx="867" cy="380" r="5" fill="#11161f"/><text x="887" y="384.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="867" cy="414" r="5" fill="#11161f"/><text x="887" y="418.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited Method1</text></g><g><circle cx="867" cy="448" r="5" fill="#11161f"/><text x="887" y="452.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="867" cy="482" r="5" fill="#11161f"/><text x="887" y="486.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g><g class="d-named-mark"><text x="1061" y="48.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="1061">ActorId2</tspan><tspan x="1061" dy="15.6">Reminder</tspan></text><line x1="1061" y1="94" x2="1061" y2="710" stroke="#747474" stroke-width="2.32"/><rect x="1051" y="502.4" width="20" height="197.20000000000005" rx="4" fill="#efca08" opacity="0.45"/><g><circle cx="1061" cy="210" r="5" fill="#ffffff" stroke="#1c2330" stroke-width="2.32"/><text x="1081" y="198.95" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330"><tspan x="1081">Request arrived,</tspan><tspan x="1081" dy="15.6">waiting for lock</tspan><tspan x="1081" dy="15.6">asynchronously</tspan></text></g><g><circle cx="1061" cy="516" r="5" fill="#11161f"/><text x="1081" y="520.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock acquired</text></g><g><circle cx="1061" cy="550" r="5" fill="#11161f"/><text x="1081" y="554.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Entered callback</text></g><g><circle cx="1061" cy="584" r="5" fill="#11161f"/><text x="1081" y="588.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Created Task</text></g><g><circle cx="1061" cy="618" r="5" fill="#11161f"/><text x="1081" y="622.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Task completed</text></g><g><circle cx="1061" cy="652" r="5" fill="#11161f"/><text x="1081" y="656.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Exited callback</text></g><g><circle cx="1061" cy="686" r="5" fill="#11161f"/><text x="1081" y="690.55" text-anchor="start" font-size="13" font-weight="400" fill="#1c2330">Lock released</text></g></g></svg>
