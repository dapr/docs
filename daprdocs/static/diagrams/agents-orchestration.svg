<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 6 998 423" role="img" aria-labelledby="agents-orchestration-title agents-orchestration-desc"><title id="agents-orchestration-title">The two ways agents are coordinated</title><desc id="agents-orchestration-desc">Two lanes side by side. On the left, event-driven orchestration: a large hexagon acting as the orchestrator publishes to a green message broker, and the broker fans out to three smaller agent hexagons. On the right, deterministic workflow orchestration: a green Start circle leads to the orchestrator hexagon, then to a gold decision diamond, which branches to one of two agent hexagons, and either branch leads on to an orange End circle.</desc><g class="d-region"><rect class="d-panel" x="29" y="54" width="340" height="340" rx="10" fill="none" stroke="#747474" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="143" y="41" width="112" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="round"/><text x="199" y="58.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Event-driven</text></g></g><g class="d-region"><rect class="d-panel" x="409" y="54" width="560" height="340" rx="10" fill="none" stroke="#747474" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="600" y="41" width="178" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="round"/><text x="689" y="58.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">Deterministic workflow</text></g></g><g class="d-arrow"><line x1="199" y1="170" x2="199" y2="194" stroke="#0D2192" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="195.16,186.98 199,194 20