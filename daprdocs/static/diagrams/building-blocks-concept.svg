<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 172" role="img" aria-labelledby="building-blocks-concept-title building-blocks-concept-desc"><title id="building-blocks-concept-title">A building block, its API and its components</title><desc id="building-blocks-concept-desc">Your code, drawn as a hexagon on the left, calls a building block over HTTP or gRPC. The arrow ends on a filled circle on the edge of the building block, which is the public API the block exposes. The building block is a card with two component boxes inside it, because a building block uses one or more Dapr components to implement its capability. Two more cards are stacked behind it: this is one building block of a set.</desc><rect x="371" y="24" width="189" height="136" rx="12" fill="#ffffff" stroke="#747474" stroke-width="1.4"/><rect x="365" y="18" width="189" height="136" rx="12" fill="#ffffff" stroke="#747474" stroke-width="1.4"/><rect x="359" y="12" width="189" height="136" rx="12" fill="#ffffff" stroke="#0D2192" stroke-width="1.4"/><text x="453.5" y="37.85" text-anchor="middle" font-size="11" font-weight="600" fill="#1c2330">Building block</text><g class="d-box"><rect x="383.5" y="57.5" width="140" height="31" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#ff4e00" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="453.5" y="76.67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2330">Component</text></g><g class="d-box"><rect x="383.5" y="98.5" width="140" height="31" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#ff4e00" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="453.5" y="117.67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2330">Component</text></g><g class="d-hex d-hex-solid"><polygon points="156,39 191.51,59.5 191.51,100.5 156,121 120.49,100.5 120.49,59.5" fill="#0bdda3" stroke="#11161f" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="156" y="83.67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#11161f">Your code</text></g><g class="d-socket"><line x1="193.51" y1="80" x2="288" y2="80" stroke="#0D2192" stroke-width="1.4"/><path d="M303,65 A15,15 0 0 0 303,95" fill="none" stroke="#0D2192" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="d-lollipop"><line x1="303" y1="80" x2="359" y2="80" stroke="#0D2192" stroke-width="1.4"/><circle cx="303" cy="80" r="7" fill="#ffffff" stroke="#0D2192" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></g><text x="239.75" y="62.67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2330">API</text><text x="239.75" y="104.67" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2330">HTTP or gRPC</text></svg>
