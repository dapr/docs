<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 106" role="img" aria-labelledby="workflow-signing-steps-title workflow-signing-steps-desc"><title id="workflow-signing-steps-title">The four steps Dapr takes to sign a batch of new workflow history events</title><desc id="workflow-signing-steps-desc">Four teal boxes in a row, joined left to right by arrows: Marshal events, deterministic protobuf; Compute digests and chain to previous signature; Sign with SVID private key; Persist signature plus certificate plus history events.</desc><g class="d-arrow"><line x1="187" y1="53" x2="243" y2="53" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="235.98,56.84 243,53 235.98,49.16" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="403" y1="53" x2="459" y2="53" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="451.98,56.84 459,53 451.98,49.16" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="619" y1="53" x2="675" y2="53" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="667.98,56.84 675,53 667.98,49.16" stroke="#0D2192" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-box"><rect x="29" y="14" width="158" height="78" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.63" stroke-linejoin="round" stroke-linecap="round"/><text x="108" y="41.95" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="108">Marshal events</tspan><tspan x="108" dy="15.6">(deterministic</tspan><tspan x="108" dy="15.6">protobuf)</tspan></text></g><g class="d-box"><rect x="245" y="14" width="158" height="78" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.63" stroke-linejoin="round" stroke-linecap="round"/><text x="324" y="41.95" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="324">Compute digests</tspan><tspan x="324" dy="15.6">&amp; chain to</tspan><tspan x="324" dy="15.6">previous signature</tspan></text></g><g class="d-box"><rect x="461" y="14" width="158" height="78" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.63" stroke-linejoin="round" stroke-linecap="round"/><text x="540" y="49.75" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="540">Sign with</tspan><tspan x="540" dy="15.6">SVID private key</tspan></text></g><g class="d-box"><rect x="677" y="14" width="158" height="78" rx="6" fill="#D3E6E6" fill-opacity="0.6" stroke="#4EA4AF" stroke-width="1.63" stroke-linejoin="round" stroke-linecap="round"/><text x="756" y="41.95" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330"><tspan x="756">Persist signature</tspan><tspan x="756" dy="15.6">+ certificate</tspan><tspan x="756" dy="15.6">+ history events</tspan></text></g></svg>
