<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.67 1350 644" role="img" aria-labelledby="rag-overview-title rag-overview-desc"><title id="rag-overview-title">The rag_ingest orchestrator and the systems it writes to</title><desc id="rag-overview-desc">A lane named rag_ingest orchestrator, a Dapr Workflow, holding six activities across: discover_and_manifest, get_manifest_batch, process_document for N documents in a bounded batch, update_status, validate_version and activate_version. update_status either loops back to get_manifest_batch for more batches, or goes on to validate_version when done. Beneath the lane, process_document downloads from the document source, parses and chunks through a parser and splitter directly below it, embeds through the embedder, and writes to the vector index. validate_version counts and verifies against that index and activate_version flips its active pointer, both arriving at the same point on its top edge, and a query-time reader below resolves the active version and searches it.</desc><g class="d-region"><rect class="d-panel" x="29" y="26" width="1292" height="148" rx="10" fill="none" stroke="#747474" stroke-width="2.55" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="13" width="276" height="26" rx="13" fill="#ffffff" stroke="#747474" stroke-width="2.55" stroke-linejoin="round" stroke-linecap="round"/><text x="187" y="30.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">rag_ingest orchestrator (Dapr Workflow)</text></g></g><g class="d-arrow"><line x1="225" y1="113" x2="267" y2="113" stroke="#0D2192" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="259.98,116.84 267,113 259.98,109.16" stroke="#0D2192" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="439" y1="113" x2="481" y2="113" stroke="#0D2192" stroke-width="2.55" stroke-linecap="round"