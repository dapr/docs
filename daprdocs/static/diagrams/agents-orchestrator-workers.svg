<svg font-family="Inter, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 -0.16 986 305" role="img" aria-labelledby="agents-orchestrator-workers-title agents-orchestrator-workers-desc"><title id="agents-orchestrator-workers-title">The orchestrator-workers pattern</title><desc id="agents-orchestrator-workers-desc">A green circle named In leads to a teal box named Orchestrator carrying a brain mark. It fans out to three teal boxes named LLM 1, LLM 2 and LLM 3, each carrying a brain mark, and all three lead to a teal box named Synthesizer, which also carries a brain mark, and on to an orange circle named Out. A note reads that the orchestrator decides how many workers there are, so three is an example rather than a fixed number.</desc><g class="d-arrow"><line x1="89" y1="134" x2="157" y2="134" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="149.98,137.84 157,134 149.98,130.16" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M247,108 L247,64 Q247,52 259,52 L403,52" fill="none" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round"/><g class="d-arrow"><line x1="377" y1="52" x2="403" y2="52" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="395.98,55.84 403,52 395.98,48.16" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g><g class="d-arrow"><line x1="335" y1="134" x2="403" y2="134" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="395.98,137.84 403,134 395.98,130.16" stroke="#0D2192" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-elbow-arrow"><path class="d-run" d="M247,160 L247,204 Q247,216 259,216 L403,216" fill="