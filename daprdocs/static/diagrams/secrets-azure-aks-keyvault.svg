<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.18 0 626 474" role="img" aria-labelledby="secrets-azure-aks-keyvault-title secrets-azure-aks-keyvault-desc"><title id="secrets-azure-aks-keyvault-title">A service in an AKS pod getting a secret from Azure Key Vault using a pod managed identity</title><desc id="secrets-azure-aks-keyvault-desc">A dashed region captioned AKS cluster. Inside it, a dashed pod holds a green hexagon named App joined by a line with a head at each end to a hexagon carrying the Dapr logo, named Dapr sidecar. Under the sidecar, still inside the pod, is a box named Pod managed identity, joined to the sidecar. Outside the cluster on the right is the Azure Key Vault mark, named Azure Key Vault, joined to the sidecar by a line with a head at each end. Below the cluster is a card holding the exchange: GET over the path /v1.0/secrets/vault/mysecret, and under it the value that comes back, mysecret "supersecret".</desc><g class="d-region"><rect class="d-panel" x="29" y="27" width="438" height="315.2" rx="10" fill="none" stroke="#0D2192" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><g class="d-pill"><rect x="49" y="14" width="110" height="26" rx="13" fill="#ffffff" stroke="#0D2192" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="104" y="31.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2330">AKS cluster</text></g></g><g class="d-arrow"><line x1="192.92" y1="161" x2="274.43" y2="161" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="267.41,164.84 274.43,161 267.41,157.16" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="d-arrow"><line x1="274.43" y1="161" x2="192.92" y2="161" stroke="#0D2192" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="199.94,157.16 192.92,161 199.94,164.84" stroke="#0